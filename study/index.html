<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161f">
<title>מעבדת מבחנים</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root { --bg:#14161f; --card:#1d2030; --line:#2c3046; --tx:#e8e9f0; --mut:#9a9db3; --acc:#f2b84b; --ok:#4fc38a; --bad:#ef6b6b; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--tx); font:16px/1.55 system-ui, "Segoe UI", Arial, sans-serif; }
#app { max-width:680px; margin:0 auto; padding:16px 16px 48px; }
header { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
header h1 { flex:1; font-size:20px; margin:0; }
h1 { color:var(--acc); }
h3 { margin:18px 0 6px; color:var(--mut); font-size:14px; font-weight:600; }
button { font:inherit; color:inherit; border:0; border-radius:10px; padding:10px 14px; cursor:pointer; background:var(--card); }
button:disabled { opacity:.5; cursor:default; }
.primary { background:var(--acc); color:#1a1300; font-weight:700; flex:1; }
.ghost { background:transparent; border:1px solid var(--line); }
.wide { width:100%; margin-top:10px; }
.row { display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:12px; }
.course, .topic { display:flex; justify-content:space-between; align-items:center; width:100%; margin-bottom:8px; text-align:right; border:1px solid var(--line); }
.course { flex-direction:column; align-items:flex-start; padding:16px; }
.course span, .topic em { color:var(--mut); font-style:normal; font-size:14px; }
.q { margin-top:0; }
.part { display:flex; align-items:center; gap:8px; margin:8px 0; flex-wrap:wrap; }
.part label { min-width:96px; }
.part input, .part select, .auth input { background:var(--bg); color:var(--tx); border:1px solid var(--line); border-radius:8px; padding:8px; font:inherit; }
.part input { width:140px; }
.part i { font-style:normal; font-size:14px; }
.part.ok i { color:var(--ok); } .part.bad i { color:var(--bad); }
.part.ok input { border-color:var(--ok); } .part.bad input { border-color:var(--bad); }
details { margin-top:12px; border-top:1px solid var(--line); padding-top:8px; }
summary { color:var(--acc); cursor:pointer; }
details div { margin-top:8px; line-height:1.9; }
.auth { display:flex; flex-direction:column; gap:10px; margin-top:10vh; }
.auth h2 { margin:0; }
.auth a { color:var(--acc); cursor:pointer; }
.msg { color:var(--acc); min-height:1em; margin:0; }
.hint { color:var(--mut); font-size:13px; margin:0; }
.sheet p { line-height:2; }
.score { font-size:22px; font-weight:700; text-align:center; color:var(--acc); }

.sheetbg { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:16px; z-index:9; }
.sheetbg .card { max-width:420px; width:100%; }
code { background:var(--bg); padding:2px 6px; border-radius:6px; word-break:break-all; }
#clock { font-variant-numeric:tabular-nums; color:var(--acc); }
</style>
</head>
<body>
<div id="app"><p>טוען…</p></div>
<script>
// Question generators. Each generator(o) returns {text, parts:[{label,ans,unit,units}], sol}.
// o = optional fixed inputs (used by tests to reproduce official exam answers).
const K = { q: 1.6e-19, e0: 8.85e-14, esi: 11.7, eox: 3.9, ni: 1.5e10, Vt: 0.0259, h: 4.135e-15, c: 2.998e10 };

const pick = a => a[Math.floor(Math.random() * a.length)];
const rnd = (min, max, step) => +(min + step * Math.floor(Math.random() * ((max - min) / step + 1))).toFixed(6);
const sq = Math.sqrt, ln = Math.log, ex = Math.exp, deg = r => r * 180 / Math.PI;

function fmt(x, s = 3) {
  if (x === 0) return '0';
  const a = Math.abs(x);
  if (a >= 1e5 || a < 1e-3) {
    const e = Math.floor(Math.log10(a)), m = x / 10 ** e;
    return `${+m.toPrecision(s)}×10<sup>${e}</sup>`;
  }
  return String(+x.toPrecision(s));
}
const U = (...u) => u; // unit option lists; first is correct

// ---------------- התקני מל"מ ----------------
const semi = {
  name: 'התקני מל"מ', code: '50006', minutes: 180,
  groups: { bjt: 'BJT', mos: 'MOS-FET', opto: 'התקני אור' },
  topics: {
    alphaBeta: { group: 'bjt', title: 'α ו-β מתוך יחס זרמים', gen(o = {}) {
      const mode = o.mode ?? pick(['IEIC', 'IEIB', 'pct']);
      let a, b, given;
      if (mode === 'IEIC') { const r = o.r ?? pick([1.0033, 1.004, 1.005, 1.01, 1.0125, 1.02]); a = 1 / r; given = `היחס בין זרם הפולט לזרם הקולט, I<sub>E</sub>/I<sub>C</sub>, הוא ${r}.`; }
      else if (mode === 'IEIB') { const r = o.r ?? pick([51, 81, 101, 121, 161, 201]); b = r - 1; a = b / (b + 1); given = `היחס בין זרם הפולט לזרם הבסיס, I<sub>E</sub>/I<sub>B</sub>, הוא ${r}.`; }
      else { const r = o.r ?? pick([95, 97, 98, 98.5, 99, 99.5]); a = r / 100; given = `בפעיל קדמי זרם הקולט הוא ${r}% מזרם הפולט.`; }
      b = a / (1 - a);
      return { text: `טרנזיסטור BJT בפעיל קדמי. ${given} חשבו את α ואת β.`,
        parts: [{ label: 'α', ans: a, unit: '' }, { label: 'β', ans: b, unit: '' }],
        sol: `α = I<sub>C</sub>/I<sub>E</sub> = <b>${fmt(a, 4)}</b><br>β = α/(1−α) = <b>${fmt(b)}</b>` };
    } },
    reverse: { group: 'bjt', title: 'פעיל אחורי: βR, IC, IE', gen(o = {}) {
      const IB = o.IB ?? pick([20, 30, 40, 50, 60, 80]) * 1e-6;
      const useA = o.aR !== undefined || (o.bR === undefined && Math.random() < 0.5);
      const aR = useA ? (o.aR ?? rnd(0.85, 0.93, 0.001)) : null;
      const bR = useA ? aR / (1 - aR) : (o.bR ?? pick([5, 6, 8, 9, 10, 12]));
      const IC = (bR + 1) * IB, IE = bR * IB, a = bR / (bR + 1);
      return { text: `טרנזיסטור NPN בפעיל אחורי. נתון ${useA ? `α<sub>R</sub> = ${aR}` : `β<sub>R</sub> = ${bR}`} ו-I<sub>B</sub> = ${fmt(IB * 1e6)}µA. חשבו ${useA ? 'את β<sub>R</sub>,' : 'את α<sub>R</sub>,'} I<sub>C</sub> ו-I<sub>E</sub>.`,
        parts: [useA ? { label: 'β<sub>R</sub>', ans: bR, unit: '' } : { label: 'α<sub>R</sub>', ans: a, unit: '' },
          { label: 'I<sub>C</sub>', ans: IC * 1e3, unit: 'mA', units: U('mA', 'µA', 'A') },
          { label: 'I<sub>E</sub>', ans: IE * 1e3, unit: 'mA', units: U('mA', 'µA', 'A') }],
        sol: `בפעיל אחורי התפקידים מתחלפים: הקולט מזריק והפולט אוסף.<br>β<sub>R</sub> = α<sub>R</sub>/(1−α<sub>R</sub>) = <b>${fmt(bR)}</b>${useA ? '' : `, α<sub>R</sub> = β<sub>R</sub>/(β<sub>R</sub>+1) = <b>${fmt(a, 4)}</b>`}<br>I<sub>E</sub> = β<sub>R</sub>·I<sub>B</sub> = <b>${fmt(IE * 1e3)} mA</b><br>I<sub>C</sub> = I<sub>E</sub> + I<sub>B</sub> = (β<sub>R</sub>+1)I<sub>B</sub> = <b>${fmt(IC * 1e3)} mA</b>` };
    } },
    baseDoping: { group: 'bjt', title: 'ריכוז סיגים בבסיס', gen(o = {}) {
      const V = o.V ?? pick([0.65, 0.68, 0.7, 0.72, 0.75, 0.78]);
      const n = o.n ?? pick([1e15, 3e15, 1e16, 2e16, 5e16]);
      const Na = K.ni ** 2 / n * ex(V / K.Vt);
      return { text: `NPN בפעיל קדמי, V<sub>BE</sub> = ${V}V. ריכוז נושאי המיעוט בתחילת הבסיס n<sub>B</sub>(x=0) = ${fmt(n)} cm<sup>-3</sup>. חשבו את ריכוז הסיגים בבסיס N<sub>a</sub>.`,
        parts: [{ label: 'N<sub>a</sub>', ans: Na, unit: 'cm⁻³', units: U('cm⁻³', 'm⁻³', 'cm⁻²') }],
        sol: `n<sub>B</sub>(0) = n<sub>B0</sub>·e<sup>V<sub>BE</sub>/V<sub>t</sub></sup> = (n<sub>i</sub>²/N<sub>a</sub>)·e<sup>V<sub>BE</sub>/V<sub>t</sub></sup><br>N<sub>a</sub> = n<sub>i</sub>²·e<sup>${V}/0.0259</sup> / ${fmt(n)} = <b>${fmt(Na)} cm<sup>-3</sup></b>` };
    } },
    eiEf: { group: 'mos', title: 'Ei−Ef מתוך ps ב-VFB', gen(o = {}) {
      const ps = o.ps ?? pick([1e4, 1e5, 2.25e4, 1e15, 5e15, 1e16, 1e17]);
      const d = K.Vt * ln(ps / K.ni);
      return { text: `כאשר V<sub>GS</sub> = V<sub>FB</sub> (פסים ישרים) ריכוז החורים בממשק הוא p<sub>s</sub> = ${fmt(ps)} cm<sup>-3</sup>. מה הפער E<sub>i</sub> − E<sub>f</sub> במצע?`,
        parts: [{ label: 'E<sub>i</sub>−E<sub>f</sub>', ans: d, unit: 'eV', units: U('eV', 'V', 'J') }],
        sol: `בפסים ישרים אין כיפוף, לכן p<sub>s</sub> = p<sub>0</sub> במצע.<br>p<sub>0</sub> = n<sub>i</sub>e<sup>(E<sub>i</sub>−E<sub>f</sub>)/kT</sup> ⇒ E<sub>i</sub>−E<sub>f</sub> = kT·ln(p<sub>s</sub>/n<sub>i</sub>) = <b>${fmt(d)} eV</b><br>${d > 0 ? 'חיובי ⇒ מצע P' : 'שלילי ⇒ מצע N'}` };
    } },
    vt: { group: 'mos', title: 'φf, Qdep ומתח סף VT', gen(o = {}) {
      const N = o.N ?? pick([1e15, 5e15, 1e16, 2e16, 5e16]);
      const VFB = o.VFB ?? pick([-0.8, -0.6, -0.5, 0, 0.4, 0.6]);
      const Cox = (o.Cox ?? pick([50, 78, 80, 100, 120])) * 1e-9;
      const p = o.type ? o.type === 'n' : Math.random() < 0.7;
      const pf = K.Vt * ln(N / K.ni), Q = sq(4 * K.e0 * K.esi * K.q * N * pf);
      const VT = p ? VFB + Q / Cox + 2 * pf : VFB - Q / Cox - 2 * pf;
      return { text: `${p ? 'NMOS (מצע P' : 'PMOS (מצע N'}, ריכוז ${fmt(N)} cm<sup>-3</sup>), V<sub>FB</sub> = ${VFB}V, C<sub>ox</sub> = ${fmt(Cox * 1e9)} nF/cm². חשבו |φ<sub>f</sub>|, |Q<sub>dep,max</sub>| ו-V<sub>T</sub>.`,
        parts: [{ label: '|φ<sub>f</sub>|', ans: pf, unit: 'V', units: U('V', 'eV', 'mV') },
          { label: '|Q<sub>dep,max</sub>|', ans: Q * 1e9, unit: 'nC/cm²', units: U('nC/cm²', 'µC/cm²', 'nF/cm²') },
          { label: 'V<sub>T</sub>', ans: VT, unit: 'V', units: U('V', 'mV', 'eV') }],
        sol: `|φ<sub>f</sub>| = V<sub>t</sub>·ln(N/n<sub>i</sub>) = <b>${fmt(pf)} V</b><br>|Q<sub>dep,max</sub>| = √(4ε<sub>0</sub>ε<sub>si</sub>qN|φ<sub>f</sub>|) = <b>${fmt(Q * 1e9)} nC/cm²</b><br>V<sub>T</sub> = V<sub>FB</sub> ${p ? '+' : '−'} |Q<sub>dep</sub>|/C<sub>ox</sub> ${p ? '+' : '−'} 2|φ<sub>f</sub>| = <b>${fmt(VT)} V</b>` };
    } },
    tox: { group: 'mos', title: 'tox מתוך Cox', gen(o = {}) {
      const C = (o.C ?? pick([78, 80, 100, 172.6, 238, 345])) * 1e-9;
      const t = K.e0 * K.eox / C;
      return { text: `צפיפות הקיבול של קבל MOS בהצטברות היא ${fmt(C * 1e9)} nF/cm². חשבו את עובי התחמוצת. (באיזה מצב נוסף C<sub>mos</sub> = C<sub>ox</sub>? בהיפוך חזק בתדר נמוך.)`,
        parts: [{ label: 't<sub>ox</sub>', ans: t * 1e8, unit: 'Å', units: U('Å', 'nm', 'cm') }],
        sol: `בהצטברות C<sub>mos</sub> = C<sub>ox</sub> = ε<sub>0</sub>ε<sub>ox</sub>/t<sub>ox</sub><br>t<sub>ox</sub> = 8.85×10<sup>-14</sup>·3.9 / ${fmt(C)} = ${fmt(t)} cm = <b>${fmt(t * 1e8)} Å</b>` };
    } },
    xd: { group: 'mos', title: 'רוחב מחסור וקיבול Cmos', gen(o = {}) {
      const N = o.N ?? pick([1e15, 5e15, 1e16, 2e16]);
      const k = o.k ?? pick([1, 1.5, 2]);
      const Cox = (o.Cox ?? pick([50, 80, 100])) * 1e-9;
      const pf = K.Vt * ln(N / K.ni), ps = k * pf;
      const Xd = sq(2 * K.e0 * K.esi * ps / (K.q * N)), Cs = K.e0 * K.esi / Xd, Cm = Cox * Cs / (Cox + Cs);
      return { text: `קבל MOS במצע P, N<sub>a</sub> = ${fmt(N)} cm<sup>-3</sup>, C<sub>ox</sub> = ${fmt(Cox * 1e9)} nF/cm². המתח על המל"מ φ<sub>s</sub> = ${k}φ<sub>f</sub>. חשבו X<sub>d</sub>, C<sub>s</sub> ו-C<sub>mos</sub>.`,
        parts: [{ label: 'X<sub>d</sub>', ans: Xd * 1e7, unit: 'nm', units: U('nm', 'µm', 'Å') },
          { label: 'C<sub>s</sub>', ans: Cs * 1e9, unit: 'nF/cm²', units: U('nF/cm²', 'µF/cm²', 'pF/cm²') },
          { label: 'C<sub>mos</sub>', ans: Cm * 1e9, unit: 'nF/cm²', units: U('nF/cm²', 'µF/cm²', 'pF/cm²') }],
        sol: `φ<sub>f</sub> = ${fmt(pf)}V ⇒ φ<sub>s</sub> = ${fmt(ps)}V<br>X<sub>d</sub> = √(2ε<sub>0</sub>ε<sub>si</sub>φ<sub>s</sub>/(qN<sub>a</sub>)) = <b>${fmt(Xd * 1e7)} nm</b>${k === 2 ? ' (= X<sub>dT</sub>, מקסימלי)' : ''}<br>C<sub>s</sub> = ε<sub>0</sub>ε<sub>si</sub>/X<sub>d</sub> = <b>${fmt(Cs * 1e9)} nF/cm²</b><br>1/C<sub>mos</sub> = 1/C<sub>ox</sub> + 1/C<sub>s</sub> ⇒ <b>${fmt(Cm * 1e9)} nF/cm²</b>` };
    } },
    ids: { group: 'mos', title: 'VDS(sat) ו-IDS', gen(o = {}) {
      const VT = o.VT ?? pick([0.4, 0.493, 0.6, 1, 1.31]);
      const VGS = o.VGS ?? +(VT + rnd(0.3, 2, 0.1)).toFixed(3);
      const Kk = o.K ?? pick([1e-3, 2e-3, 5e-4]);
      const sat = VGS - VT, Imax = 0.5 * Kk * sat ** 2;
      const VDS = o.VDS ?? +(sat * pick([0.3, 0.5, 0.7])).toFixed(2);
      const Ilin = Kk * (sat * VDS - VDS ** 2 / 2);
      return { text: `NMOS עם V<sub>T</sub> = ${VT}V, K = ${fmt(Kk)} A/V², V<sub>GS</sub> = ${VGS}V. חשבו V<sub>DS(sat)</sub>, את הזרם ברוויה, ואת הזרם כאשר V<sub>DS</sub> = ${VDS}V.`,
        parts: [{ label: 'V<sub>DS(sat)</sub>', ans: sat, unit: 'V', units: U('V', 'mV') },
          { label: 'I<sub>DS(max)</sub>', ans: Imax * 1e3, unit: 'mA', units: U('mA', 'µA', 'A') },
          { label: `I<sub>DS</sub> @ ${VDS}V`, ans: Ilin * 1e3, unit: 'mA', units: U('mA', 'µA', 'A') }],
        sol: `V<sub>DS(sat)</sub> = V<sub>GS</sub>−V<sub>T</sub> = <b>${fmt(sat)} V</b> (נקודת הצביטה)<br>רוויה: I = ½K(V<sub>GS</sub>−V<sub>T</sub>)² = <b>${fmt(Imax * 1e3)} mA</b><br>V<sub>DS</sub> < V<sub>DS(sat)</sub> ⇒ תחום ליניארי: I = K[(V<sub>GS</sub>−V<sub>T</sub>)V<sub>DS</sub> − V<sub>DS</sub>²/2] = <b>${fmt(Ilin * 1e3)} mA</b>` };
    } },
    absorb: { group: 'opto', title: 'מקדם בליעה', gen(o = {}) {
      if ((o.mode ?? pick(['findA', 'findPct'])) === 'findA') {
        const f = o.f ?? pick([40, 50, 60, 70, 80]), d = o.d ?? pick([0.28, 0.5, 1, 2]);
        const a = -ln(1 - f / 100) / (d * 1e-4);
        return { text: `${f}% מעוצמת ההארה נבלע בשכבה בעובי ${d} µm. חשבו את מקדם הבליעה α.`,
          parts: [{ label: 'α', ans: a, unit: 'cm⁻¹', units: U('cm⁻¹', 'm⁻¹', 'µm⁻¹') }],
          sol: `I(d)/I<sub>0</sub> = e<sup>−αd</sup> = ${1 - f / 100}<br>α = −ln(${1 - f / 100}) / (${d}×10<sup>-4</sup> cm) = <b>${fmt(a)} cm<sup>-1</sup></b><br>שימו לב: ${f}% <u>נבלע</u> ⇒ עובר ${100 - f}%.` };
      }
      const a = o.a ?? pick([5e3, 1e4, 5e4, 8e4]), d = o.d ?? pick([0.5, 1, 2]);
      const pct = (1 - ex(-a * d * 1e-4)) * 100;
      return { text: `מקדם הבליעה α = ${fmt(a)} cm<sup>-1</sup>. איזה אחוז מעוצמת האור נבלע בשכבה בעובי ${d} µm?`,
        parts: [{ label: 'נבלע', ans: pct, unit: '%', units: U('%') }],
        sol: `נבלע = 1 − e<sup>−αd</sup> = 1 − e<sup>−${fmt(a * d * 1e-4)}</sup> = <b>${fmt(pct)}%</b>` };
    } },
    eg: { group: 'opto', title: 'Eg ↔ תדר / אורך גל', gen(o = {}) {
      const byF = o.f !== undefined || (o.lam === undefined && Math.random() < 0.5);
      const f = byF ? (o.f ?? pick([300, 400, 450, 600, 650])) * 1e12 : null;
      const lam = byF ? K.c / f * 1e4 : (o.lam ?? pick([100, 450, 520, 680, 870, 1100])) / 1000; // µm
      const E = 1.24 / lam;
      return { text: byF ? `התקן פולט אור בתדר ${f / 1e12} THz. חשבו את אורך הגל ואת E<sub>g</sub>.` : `LED פולט אור באורך גל ${fmt(lam * 1000)} nm. חשבו את E<sub>g</sub> של הסריג.`,
        parts: [...(byF ? [{ label: 'λ', ans: lam, unit: 'µm', units: U('µm', 'nm', 'cm') }] : []), { label: 'E<sub>g</sub>', ans: E, unit: 'eV', units: U('eV', 'J', 'V') }],
        sol: `${byF ? `λ = c/ν = 2.998×10<sup>10</sup>/${fmt(f)} = <b>${fmt(lam)} µm</b><br>` : ''}E[eV] = 1.24/λ[µm] = <b>${fmt(E)} eV</b>${byF ? ` (או hν = 4.135×10<sup>-15</sup>·${fmt(f)})` : ''}<br>לגלאי: כל חומר עם E<sub>g</sub> ≤ ${fmt(E)} eV יגיב לקרינה הזו.` };
    } },
    solar: { group: 'opto', title: 'תא שמש: Isc ↔ Voc', gen(o = {}) {
      const Is = o.Is ?? pick([1e-12, 3e-12, 5e-12, 1e-11]);
      if ((o.mode ?? pick(['isc', 'voc'])) === 'isc') {
        const Voc = o.Voc ?? pick([0.55, 0.58, 0.6, 0.62, 0.65]), I = Is * (ex(Voc / K.Vt) - 1);
        return { text: `תא שמש בטמפ' החדר: V<sub>oc</sub> = ${Voc}V, I<sub>s</sub> = ${fmt(Is)} A. חשבו את I<sub>sc</sub>.`,
          parts: [{ label: 'I<sub>sc</sub>', ans: I * 1e3, unit: 'mA', units: U('mA', 'A', 'µA') }],
          sol: `במעגל פתוח I = 0 ⇒ I<sub>L</sub> = I<sub>s</sub>(e<sup>V<sub>oc</sub>/V<sub>t</sub></sup> − 1)<br>בקצר I<sub>sc</sub> = I<sub>L</sub> = <b>${fmt(I * 1e3)} mA</b>` };
      }
      const IL = (o.IL ?? pick([20, 50, 60, 70, 100])) * 1e-3, Voc = K.Vt * ln(IL / Is + 1);
      return { text: `תא שמש בטמפ' החדר מפתח I<sub>L</sub> = ${fmt(IL * 1e3)} mA, I<sub>s</sub> = ${fmt(Is)} A. חשבו V<sub>oc</sub>.`,
        parts: [{ label: 'V<sub>oc</sub>', ans: Voc, unit: 'V', units: U('V', 'mV') }],

      : `<ol><li>פתח את <b>Chrome</b> והקלד בשורת הכתובת:<br><code dir="ltr">${url}</code></li><li>תפריט <b>⋮</b> ← <b>"התקנת אפליקציה"</b> (או "הוספה למסך הבית").</li></ol><p class="hint">מקלידים ולא לוחצים על קישור — אחרת הטלפון יכול לפתוח את הדף בתוך המגדל.</p>`}
      <div class="row"><button class="primary" id="cp">העתק כתובת</button><button class="ghost" id="cl">סגור</button></div></div>`;
    document.body.append(d);
    d.querySelector('#cl').onclick = () => d.remove();
    d.querySelector('#cp').onclick = async e => { try { await navigator.clipboard.writeText(url); e.target.textContent = 'הועתק ✓'; } catch { e.target.textContent = url; } };
  });
}
const $ = s => document.querySelector(s);
const app = () => $('#app');

function parseNum(s) {
  s = String(s).trim().replace(/,/g, '.').replace(/\s/g, '').replace(/[×x*]10\^?/i, 'e').replace(/e\+?/i, 'e');
  return s === '' ? NaN : Number(s);
}
const pctTxt = st => st && st.a ? Math.round(100 * st.c / st.a) + '%' : '—';

// ---------- auth ----------
function authView(mode = 'login', msg = '') {
  clearInterval(timer);
  const titles = { login: 'כניסה', signup: 'הרשמה', forgot: 'שכחתי סיסמה', recover: 'סיסמה חדשה' };
  app().innerHTML = `<div class="card auth"><h1>מעבדת מבחנים</h1><h2>${titles[mode]}</h2>
    ${mode !== 'recover' ? '<input id="em" type="email" placeholder="אימייל" autocomplete="email">' : ''}
    ${mode !== 'forgot' ? `<input id="pw" type="password" placeholder="${mode === 'recover' ? 'סיסמה חדשה' : 'סיסמה'}" autocomplete="${mode === 'login' ? 'current-password' : 'new-password'}">` : ''}
    <button id="go" class="primary">${mode === 'forgot' ? 'שלח קישור איפוס' : titles[mode]}</button>
    <p class="msg">${msg}</p>
    ${mode === 'login' ? '<a data-m="forgot">שכחתי סיסמה</a> · <a data-m="signup">אין לי חשבון</a>' : mode !== 'recover' ? '<a data-m="login">חזרה לכניסה</a>' : ''}
    <p class="hint">אותו חשבון כמו באפליקציות הבית.</p>${instBtn()}</div>`;
  bindInst();
  app().querySelectorAll('a[data-m]').forEach(a => a.onclick = () => authView(a.dataset.m));
  $('#go').onclick = async () => {
    const email = $('#em')?.value.trim(), password = $('#pw')?.value;
    let r;
    try {
    if (mode === 'login') r = await sb.auth.signInWithPassword({ email, password });
    else if (mode === 'signup') r = await sb.auth.signUp({ email, password });
    else if (mode === 'forgot') r = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.split('#')[0] });
    else r = await sb.auth.updateUser({ password });
    } catch (e) { return authView(mode, '⚠ אין חיבור לשרת: ' + e.message); }
    if (r.error) return authView(mode, '⚠ ' + r.error.message);
    if (mode === 'forgot') return authView('login', 'נשלח מייל עם קישור לאיפוס.');
    if (mode === 'signup' && !r.data.session) return authView('login', 'נשלח מייל אימות. אשר אותו והיכנס.');
    if (mode === 'recover') history.replaceState(null, '', location.pathname);
  };
}

let recovering = /type=recovery/.test(location.hash);
// supabase-js: don't await its calls inside this callback (can deadlock), so defer with setTimeout.
sb.auth.onAuthStateChange((ev, session) => setTimeout(async () => {
  if (ev === 'PASSWORD_RECOVERY') recovering = true;
  if (ev === 'USER_UPDATED' && recovering) { recovering = false; user = null; }
  if (recovering) return authView('recover');
  const next = session?.user || null;
  if (next?.id === user?.id && ev !== 'INITIAL_SESSION' && ev !== 'USER_UPDATED') return;
  user = next;
  if (!user) return authView();
  await loadProgress();
  homeView();
}));

async function loadProgress() {
  progress = {};
  const { data } = await sb.from('study_progress').select('course,topic,attempts,correct');
  (data || []).forEach(r => ((progress[r.course] ??= {})[r.topic] = { a: r.attempts, c: r.correct }));
}
async function record(course, topic, n, ok) {
  const st = ((progress[course] ??= {})[topic] ??= { a: 0, c: 0 });
  st.a += n; st.c += ok;
  await sb.from('study_progress').upsert({ user_id: user.id, course, topic, attempts: st.a, correct: st.c, updated_at: new Date().toISOString() });
}

// ---------- screens ----------
function homeView() {
  clearInterval(timer);
  app().innerHTML = `<header><h1>מעבדת מבחנים</h1>${instBtn()}<button id="out" class="ghost">יציאה</button></header>
    ${Object.entries(COURSES).map(([id, c]) => `<button class="course${c.soon ? ' soon' : ''}" data-c="${id}" ${c.soon ? 'disabled' : ''}>
      <b>${c.name}</b><span>${c.soon ? 'בקרוב' : `${Object.keys(c.topics).length} סוגי שאלות · דיוק ${courseAcc(id)}`}</span></button>`).join('')}`;
  $('#out').onclick = () => sb.auth.signOut();
  bindInst();
  app().querySelectorAll('[data-c]').forEach(b => b.onclick = () => courseView(b.dataset.c));
}
function courseAcc(id) {
  const v = Object.values(progress[id] || {}), a = v.reduce((s, x) => s + x.a, 0), c = v.reduce((s, x) => s + x.c, 0);
  return a ? Math.round(100 * c / a) + '%' : '—';
}
function courseView(id) {
  clearInterval(timer);
  const C = COURSES[id];
  const groups = Object.entries(C.groups).map(([g, gname]) => `<h3>${gname}</h3>` +
    Object.entries(C.topics).filter(([, t]) => t.group === g).map(([k, t]) =>
      `<button class="topic" data-t="${k}"><span>${t.title}</span><em>${pctTxt(progress[id]?.[k])}</em></button>`).join('')).join('');
  app().innerHTML = `<header><button class="ghost" id="back">→</button><h1>${C.name}</h1></header>
    <div class="row"><button class="primary" id="weak">תרגול נקודות חולשה</button><button class="primary" id="exam">מבחן מלא (${C.minutes} דק')</button></div>
    <button class="ghost wide" id="sheet">דף נוסחאות</button>${groups}`;
  $('#back').onclick = homeView;
  $('#sheet').onclick = () => sheetView(id);
  $('#weak').onclick = () => practice(id, weakest(id));
  $('#exam').onclick = () => examView(id);
  app().querySelectorAll('[data-t]').forEach(b => b.onclick = () => practice(id, [b.dataset.t]));
}
function weakest(id) {
  const score = k => { const s = progress[id]?.[k]; return s && s.a ? s.c / s.a : 0.5; };
  return Object.keys(COURSES[id].topics).sort((a, b) => score(a) - score(b)).slice(0, 3);
}
function sheetView(id) {
  app().innerHTML = `<header><button class="ghost" id="back">→</button><h1>דף נוסחאות</h1></header><div class="card sheet">${COURSES[id].sheet}</div>`;
  $('#back').onclick = () => courseView(id);
}

function partsHTML(q, qi) {
  return q.parts.map((p, i) => `<div class="part" id="p${qi}_${i}"><label>${p.label} =</label>
    <input inputmode="decimal" dir="ltr" placeholder="1.23e16">
    ${p.units ? `<select>${['', ...shuffle(p.units)].map(u => `<option>${u}</option>`).join('')}</select>` : p.unit ? `<span>${p.unit}</span>` : ''}
    <i></i></div>`).join('');
}
const nb = h => h.replace(/(\d|<\/sup>) (?=[A-Za-zµΩÅ°%])/g, '$1&nbsp;');
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
function grade(q, qi) {
  let ok = 0;
  q.parts.forEach((p, i) => {
    const el = $(`#p${qi}_${i}`), v = parseNum(el.querySelector('input').value), sel = el.querySelector('select');
    const numOk = isFinite(v) && Math.abs(v - p.ans) <= TOL * Math.abs(p.ans) + 1e-12;
    const unitOk = !sel || sel.value === p.unit;
    el.querySelector('i').textContent = numOk && unitOk ? '✓' : !numOk ? `✗ ${fmt(p.ans).replace(/<[^>]+>/g, '')}` : '✗ יחידות';
    el.className = 'part ' + (numOk && unitOk ? 'ok' : 'bad');
    if (numOk && unitOk) ok++;
  });
  return ok;
}

function practice(id, keys) {
  clearInterval(timer);
  const C = COURSES[id], k = keys[Math.floor(Math.random() * keys.length)], t = C.topics[k], q = t.gen();
  app().innerHTML = `<header><button class="ghost" id="back">→</button><h1>${t.title}</h1></header>
    <div class="card"><p class="q">${nb(q.text)}</p>${partsHTML(q, 0)}
    <div class="row"><button class="primary" id="check">בדוק</button><button class="ghost" id="next">שאלה אחרת</button></div>
    <details id="sol" hidden><summary>פתרון מלא</summary><div>${nb(q.sol)}</div></details></div>`;
  $('#back').onclick = () => courseView(id);
  $('#next').onclick = () => practice(id, keys);
  $('#check').onclick = () => {
    const ok = grade(q, 0);
    record(id, k, q.parts.length, ok);
    $('#check').disabled = true; $('#sol').hidden = false; if (ok < q.parts.length) $('#sol').open = true;
  };
}

function examView(id) {
  const C = COURSES[id], byGroup = Object.keys(C.groups).map(g => shuffle(Object.keys(C.topics).filter(k => C.topics[k].group === g)));
  const keys = [];
  for (let r = 0; keys.length < 6; r++) byGroup.forEach(g => g[r] && keys.length < 6 && keys.push(g[r]));
  const qs = keys.map(k => ({ k, q: C.topics[k].gen() }));
  let left = C.minutes * 60;
  app().innerHTML = `<header><button class="ghost" id="back">→</button><h1>מבחן – ${C.name}</h1><b id="clock"></b></header>
    ${qs.map(({ k, q }, i) => `<div class="card"><h3>שאלה ${i + 1} · ${C.groups[C.topics[k].group]}</h3><p class="q">${nb(q.text)}</p>${partsHTML(q, i)}
      <details hidden class="esol"><summary>פתרון</summary><div>${nb(q.sol)}</div></details></div>`).join('')}
    <button class="primary wide" id="submit">הגשה</button><p id="score" class="score"></p>`;
  const tick = () => { $('#clock').textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`; if (left-- <= 0) submit(); };
  const submit = () => {
    clearInterval(timer);
    let tot = 0, ok = 0;
    qs.forEach(({ k, q }, i) => { const g = grade(q, i); ok += g; tot += q.parts.length; record(id, k, q.parts.length, g); });
    app().querySelectorAll('.esol').forEach(d => d.hidden = false);
    $('#submit').remove();
    $('#back').onclick = () => courseView(id);
    $('#score').textContent = `ציון: ${Math.round(100 * ok / tot)} (${ok}/${tot} סעיפים)`;
    $('#score').scrollIntoView({ behavior: 'smooth' });
  };
  $('#back').onclick = () => confirm('לצאת מהמבחן? ההתקדמות לא תישמר.') && courseView(id);
  $('#submit').onclick = submit;
  tick(); timer = setInterval(tick, 1000);
}

</script>
</body>
</html>
