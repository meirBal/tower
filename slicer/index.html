<style>

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  .section { color:var(--gold); font-weight:600; font-size:.9em; margin:24px 0 4px; }
  .card { background:linear-gradient(var(--tile1),var(--tile2)); border:1.5px solid var(--accent,var(--gold)); box-shadow:0 0 10px -2px var(--accent,var(--gold));
          border-radius:22px; padding:14px 18px; margin-top:10px; }
  .card b { display:block; font-size:1.04em; font-weight:600; }
  .card span, .card .sub { color:var(--muted); font-size:.9em; white-space:pre-line; }
  button.pill { display:flex; width:100%; align-items:center; justify-content:center; gap:10px; margin-top:10px; padding:14px 18px; border-radius:999px;
          background:linear-gradient(var(--tile1),var(--tile2)); color:var(--text); font:inherit; border:1.5px solid var(--accent,var(--gold));
          box-shadow:0 0 12px -3px var(--accent,var(--gold)); cursor:pointer; }
  button.pill:disabled { opacity:.5; }
  button.link { display:block; width:100%; text-align:center; color:var(--cyan); padding:12px; background:none; border:0; font:inherit; font-size:.92em; cursor:pointer; }
  input, select, textarea { width:100%; margin-top:10px; padding:13px 20px; border-radius:999px; border:1.5px solid var(--line); background:linear-gradient(var(--tile1),var(--tile2));
          color:var(--text); font:inherit; font-size:16px; outline:none; }
  textarea { border-radius:18px; min-height:96px; resize:vertical; }
  input:focus, select:focus, textarea:focus { border-color:var(--gold); }

  .choices button { flex:1 1 auto; padding:11px 14px; border-radius:999px; border:1.5px solid var(--line); background:linear-gradient(var(--tile1),var(--tile2)); color:var(--text); font:inherit; font-size:.92em; cursor:pointer; }

  .tabs { flex-wrap:nowrap; overflow-x:auto; }
  .tabs button { flex:0 0 auto; }
  .steps { display:flex; gap:6px; overflow-x:auto; padding:6px 0 2px; }
  .steps span { flex:0 0 auto; padding:6px 12px; border-radius:999px; border:1px solid var(--line); color:var(--muted); font-size:.8em; white-space:nowrap; }
  .steps span.done { border-color:var(--gold); color:var(--gold); }
  .steps span.now { background:var(--gold); border-color:var(--gold); color:#1d2240; box-shadow:0 0 10px var(--gold); }
  .viewer { position:relative; height:min(60vh,380px); margin-top:10px; border-radius:22px; overflow:hidden; border:1.5px solid var(--line); background:radial-gradient(circle at 50% 40%, #26336a, #0e1430); }
  .viewer canvas { display:block; width:100%; height:100%; touch-action:none; }
  .viewer .hint { position:absolute; inset:auto 0 8px; text-align:center; color:var(--muted); font-size:.8em; pointer-events:none; }

  .rows { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; margin-top:8px; font-size:.93em; }
  .rows dt { color:var(--muted); } .rows dd { margin:0; }
  .ok { color:var(--green); } .bad { color:var(--red); } .warn { color:var(--gold); }
  ul.list { margin:8px 0 0; padding-inline-start:20px; color:var(--muted); font-size:.92em; } ul.list li { margin:4px 0; }
  .dot { display:inline-block; width:14px; height:14px; border-radius:50%; vertical-align:-2px; border:1px solid #fff6; margin-inline-end:6px; }

  .spool select { text-align:center; border-color:var(--gold); color:var(--gold); }
  .toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 28px); transform:translateX(-50%); background:#000c; color:#fff; padding:12px 18px;
           border-radius:14px; max-width:90%; font-size:.92em; z-index:70; text-align:center; }
  #modal .back { position:fixed; inset:0; background:#000b; display:flex; align-items:center; justify-content:center; z-index:60; padding:20px; }
  #modal .card { max-width:420px; width:100%; }
  .ver { text-align:center; color:var(--muted); font-size:.7em; margin-top:22px; }
  img.idea { width:100%; border-radius:18px; margin-top:10px; border:1px solid var(--line); }
  /* the assistant chat: bot on the right (start), her messages on the left (end) */
  .chat { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .bubble { max-width:86%; padding:10px 14px; border-radius:18px; white-space:pre-line; line-height:1.45; font-size:.95em; }
  .bubble.bot { align-self:flex-start; background:linear-gradient(var(--tile1),var(--tile2)); border:1.5px solid var(--gold); border-start-start-radius:6px; }
  .bubble.me { align-self:flex-end; background:#2f3f86; border:1.5px solid var(--cyan); border-start-end-radius:6px; }
  .bubble.wide { max-width:100%; }
  .bubble img { display:block; max-width:100%; border-radius:12px; margin-top:6px; }
  .typing i { display:inline-block; width:7px; height:7px; margin:0 2px; border-radius:50%; background:var(--gold); animation:blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay:.2s; } .typing i:nth-child(3) { animation-delay:.4s; }
  @keyframes blink { 0%,80%,100% { opacity:.2; } 40% { opacity:1; } }
  .prog { margin-top:8px; font-size:.82em; color:var(--muted); }
  .prog > div { height:6px; border-radius:3px; background:#ffffff1a; overflow:hidden; margin-bottom:4px; }
  .prog > div > b { display:block; height:100%; width:3%; background:linear-gradient(90deg,var(--cyan),var(--gold)); transition:width 1s linear; }
  .chat .choices { align-self:stretch; margin-top:0; }
  .chat-input { display:flex; gap:6px; align-items:center; margin-top:10px; }
  .chat-input input { flex:1; margin:0; }
  .concepts { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:8px; }
  .concepts button { background:#0004; border:1.5px solid var(--line); border-radius:14px; padding:6px; color:var(--text); font:inherit; cursor:pointer; }
  .concepts button.sel { border-color:var(--gold); box-shadow:0 0 8px -2px var(--gold); }
  .concepts img { width:100%; aspect-ratio:1; background:#f3eee2; border-radius:10px; margin:0; }
  .concepts b { display:block; font-size:.8em; margin-top:4px; } .concepts small { display:block; color:var(--muted); font-size:.7em; }
</style>

<script type="module">
// הסלייסר החכם — idea / photo / 3D file → AI guidance → print settings → admin approval. Same Supabase project as the family apps.
import * as G from "./geo.js";
const SUPABASE_URL = "https://enhqzgjqqyubgfysnjib.supabase.co";
const SUPABASE_KEY = "sb_publishable_w3aqbIxj_ECmMOUhANPebw_thGqD9o1";
const VAPID_PUBLIC = "BGqmEpQHwvDEXD9X5wpcbmuLUFe_0lGojHmijB4ky-ajBYdW87J7qhz-h0cEdiuuFpdQB2sveAbRcvrmLJKZowo";   // same key pair as the family apps
const VERSION = "2.1";
const MIN_PASSWORD = 8;
const PRINTER = { mk4s: "Prusa MK4S", u1: "Snapmaker U1" };
const STATUS = { draft: ["טיוטה", "line"], pending_review: ["ממתין לאישור", "gold"], returned: ["הוחזר לתיקון", "red"], approved: ["אושר", "cyan"], printed: ["הודפס", "green"] };
const LAYER = (l) => l <= 0.12 ? "עדין מאוד" : l <= 0.16 ? "עדין" : l <= 0.2 ? "רגיל" : "מהיר";
const SUPPORTS = { none: "בלי תמיכות", tree: "תמיכות עץ", painted: "תמיכות רק במקומות הנדרשים" };
const SPARE = 50;                                   // grams a spool must keep after a print
const app = document.getElementById("app"), modal = document.getElementById("modal");
let me = null, printers = [], spools = [], names = {};
let view = null, adminPoll = null, screen = 0, screenTimer = null;
const models = new Map();                       // file path → triangles (Float32Array), kept for the session

// ---------- small helpers ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ddmm = iso => new Date(iso).toLocaleString("he-IL", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
function toast(msg) { document.querySelectorAll(".toast").forEach(x => x.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3800); }
const store = {
  get: k => { try { return JSON.parse(localStorage.getItem("slc_" + k)); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem("slc_" + k, JSON.stringify(v)); } catch {} },
  del: k => { try { localStorage.removeItem("slc_" + k); } catch {} },
};

// ---------- Supabase (plain fetch, like the other family apps) ----------
class ApiError extends Error { constructor(code, msg) { super(msg); this.code = code; } }
async function http(method, path, body, tok, headers = {}) {
  const h = { apikey: SUPABASE_KEY, ...headers };
  if (tok) h.Authorization = "Bearer " + tok;
  if (body != null) h["Content-Type"] = "application/json";
  let r;
  try { r = await fetch(SUPABASE_URL + path, { method, headers: h, body: body == null ? undefined : JSON.stringify(body) }); }
  catch { throw new ApiError(0, "אין חיבור לשרת — בדקי אינטרנט ונסי שוב"); }
  const text = await r.text();
  if (!r.ok) throw new ApiError(r.status, text);
  return text ? JSON.parse(text) : null;
}
function saveSession(j) {
  store.set("session", { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Math.floor(Date.now() / 1000) + j.expires_in, user_id: j.user.id });
}
let refreshing = null;
async function token() {
  const s = store.get("session");
  if (!s) throw new ApiError(401, "not logged in");
  if (Date.now() / 1000 < s.expires_at - 60) return s.access_token;
  refreshing ??= http("POST", "/auth/v1/token?grant_type=refresh_token", { refresh_token: s.refresh_token }).then(saveSession).finally(() => refreshing = null);
  await refreshing;
  return store.get("session").access_token;
}
const loggedIn = () => !!store.get("session");
const db = {
  get: async q => http("GET", "/rest/v1/" + q, null, await token()),
  add: async (table, row) => (await http("POST", "/rest/v1/" + table, row, await token(), { Prefer: "return=representation" }))[0],
  set: async (q, row) => {
    const out = await http("PATCH", "/rest/v1/" + q, row, await token(), { Prefer: "return=representation" });
    if (!out.length) throw new ApiError(403, "אין הרשאה לשנות את זה עכשיו");
    return out[0];
  },
  del: async q => http("DELETE", "/rest/v1/" + q, null, await token()),
};
const setP = (id, row) => db.set(`slicer_projects?id=eq.${id}`, row);
const rpc = async (fn, args) => http("POST", "/rest/v1/rpc/" + fn, args, await token());
const ai = async (action, projectId, extra = {}) => http("POST", "/functions/v1/slicer-ai", { action, project_id: projectId, ...extra }, await token());
// the PC worker: connected (seen in the last 2 minutes) → true / false; null when it can't be checked
const pcOnline = () => rpc("slicer_worker_status", {}).then(r => !!r?.online).catch(() => null);
const pushCall = async (action, projectId) => http("POST", "/functions/v1/slicer-push", { action, project_id: projectId }, await token());
const notify = projectId => pushCall("notify", projectId).catch(() => {});      // tell the other side; the in-app popup is the fallback
async function handOver(p, row, msg) { await setP(p.id, row); notify(p.id); toast(msg); go(project, p.id); }
async function upload(path, blob) {
  const r = await fetch(`${SUPABASE_URL}/storage/v1/object/slicer/${path}`, {
    method: "POST", body: blob, headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + await token(), "x-upsert": "true", "Content-Type": blob.type || "application/octet-stream" },
  }).catch(() => null);
  if (!r || !r.ok) throw new ApiError(r ? r.status : 0, r ? await r.text() : "ההעלאה נכשלה — בדקי אינטרנט");
}
// a file to keep: a signed link that downloads with its own name (blob: links don't work inside the Android app)
async function saveFile(path, name) {
  const { signedURL } = await http("POST", "/storage/v1/object/sign/slicer/" + path, { expiresIn: 600 }, await token());
  const a = document.createElement("a");
  a.href = `${SUPABASE_URL}/storage/v1${signedURL}&download=${encodeURIComponent(name)}`;
  document.body.appendChild(a); a.click(); a.remove();
}
async function download(path) {
  const r = await fetch(`${SUPABASE_URL}/storage/v1/object/authenticated/slicer/${path}`, { cache: "no-store", headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + await token() } }).catch(() => null);
  if (!r || !r.ok) throw new ApiError(r ? r.status : 0, "לא הצלחתי להוריד את הקובץ");
  return r.blob();
}

function errText(e) {
  let m = String(e && e.message || e);
  try { const j = JSON.parse(m); m = j.error || j.message || j.msg || m; } catch {}
  if (/Invalid login/.test(m)) return "אימייל או סיסמה שגויים";
  if (/Email not confirmed/.test(m)) return "צריך קודם לאשר את מייל האימות";
  if (/not approved/.test(m)) return "אפשר לסמן הודפס רק אחרי אישור";
  if (e instanceof ApiError && e.code && !/[א-ת]/.test(m)) return `שגיאה ${e.code}: ${m.slice(0, 150)}`;
  return m;
}
const authErr = e => e instanceof ApiError && (e.code === 401 || (e.code === 400 && /refresh|JWT|not logged/i.test(e.message)));
async function act(work) { try { await work(); } catch (e) { toast(errText(e)); } }

// ---------- UI building ----------
function h(html, into = app) { into.insertAdjacentHTML("beforeend", html); return into.lastElementChild; }
function clear() { clearInterval(screenTimer); if (view) { view.dispose(); view = null; } app.innerHTML = ""; }
function bar(title, { back = false, logout = false } = {}) {
  const el = h(`<div class="bar">${back ? `<button class="icon-btn" aria-label="חזרה">→</button>` : ""}<h1>${esc(title)}</h1>${logout ? `<button class="icon-btn" aria-label="התנתקות" style="font-size:1em">יציאה</button>` : ""}</div>`);
  if (back) el.firstElementChild.onclick = () => go(home);
  if (logout) el.lastElementChild.onclick = () => { store.del("session"); me = null; clearInterval(adminPoll); route(); };
}
const label = (t, into) => h(`<div class="label">${esc(t)}</div>`, into);
const section = t => h(`<div class="section">${esc(t)}</div>`);
function card(head, accent, body, into) {
  return h(`<div class="card" style="--accent:var(--${accent})"><b>${esc(head)}</b>${body ? `<span>${esc(body)}</span>` : ""}</div>`, into);
}
function pill(text, accent, onClick, into) {
  const el = h(`<button class="pill" style="--accent:var(--${accent})">${esc(text)}</button>`, into);
  el.onclick = async () => { el.disabled = true; el.textContent = "⏳ רגע…"; try { await onClick(); } finally { el.disabled = false; el.textContent = text; } };
  return el;
}
const li = x => typeof x === "string" ? `<li>${esc(x)}</li>` : `<li class="${x.level === "high" ? "bad" : x.level === "medium" ? "warn" : ""}">${esc(x.text)}</li>`;
const list = (items, into) => h(`<ul class="list">${items.map(li).join("")}</ul>`, into);
const listCard = (head, accent, items) => items?.length && list(items, card(head, accent));
// a card with a two-column "name: value" table; add(name, html)
function rowsCard(head, accent) {
  const c = h(`<div class="card" style="--accent:var(--${accent})">${head ? `<b>${esc(head)}</b>` : ""}<dl class="rows"></dl></div>`), dl = c.querySelector("dl");
  return { c, add: (k, v) => dl.insertAdjacentHTML("beforeend", `<dt>${esc(k)}</dt><dd>${v}</dd>`) };
}
function link(text, onClick, into) { const el = h(`<button class="link">${esc(text)}</button>`, into); el.onclick = onClick; return el; }
function field(placeholder, type = "text", auto = "", into) { return h(`<input type="${type}" placeholder="${esc(placeholder)}" ${auto ? `autocomplete="${auto}"` : ""}>`, into); }
function choices(items, selected, onPick, cls = "") {
  const row = h(`<div class="choices ${cls}">${items.map(([v, t]) => `<button data-v="${esc(v)}" class="${v === selected ? "sel" : ""}">${esc(t)}</button>`).join("")}</div>`);
  row.querySelectorAll("button").forEach(b => b.onclick = () => onPick(b.dataset.v, b, row));
  return row;
}
const footer = () => h(`<div class="ver">גרסה ${VERSION}</div>`);

// every screen loads its data first and returns a draw function, so a slow load never draws over the next screen
async function go(fn, ...args) {
  const my = ++screen;
  clear(); label("טוען…");
  try {
    const draw = await fn(...args);
    if (my !== screen) return;
    clear(); draw(); footer();
  } catch (e) {
    if (my !== screen) return;
    if (authErr(e)) { store.del("session"); return route(); }
    clear(); label(errText(e)); pill("נסי שוב", "gold", () => go(fn, ...args)); link("→ לדף הבית", () => go(home));
  }
}

async function loadBase() {
  const uid = store.get("session").user_id;
  const [mine, pr, sp, mem] = await Promise.all([
    db.get(`slicer_members?user_id=eq.${uid}&select=*`), db.get("slicer_printers?select=*&order=id"),
    db.get("slicer_spools?select=*&order=printer_id,slot"), db.get("slicer_members?select=user_id,display_name"),
  ]);
  me = mine[0] || null; printers = pr || []; spools = sp || [];
  names = Object.fromEntries((mem || []).map(m => [m.user_id, m.display_name]));
}
const printerOf = id => printers.find(p => p.id === id);
const spoolOf = (printer, slot) => spools.find(s => s.printer_id === printer && s.slot === slot);
const spoolName = s => s ? `${s.color_name || s.color_hex} · ${s.material}${s.brand ? " · " + s.brand : ""}` : "לא מוגדר";

// ---------- start ----------
async function route() {
  if (location.hash.includes("type=recovery")) { clear(); return showNewPassword(); }
  if (!loggedIn()) { clear(); return showLogin(); }
  go(async () => {
    await loadBase();
    if (!me) return () => { bar("הסלייסר החכם", { logout: true }); card("אין גישה", "red", "החשבון הזה לא מורשה לאפליקציה.\nאם זו טעות — דברי עם מאיר."); };
    startAdminPoll();
    saveNativePush();
    const open = new URLSearchParams(location.search).get("project");
    return open ? await project(open) : await home();
  });
}

const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;

}
const nativeToken = () => { try { return window.SlicerNative?.fcmToken?.() || null; } catch { return null; } };

}

function pushBlock() {

  }));
  link("כיבוי התראות", () => act(async () => {
    try { const sub = await (await navigator.serviceWorker.ready).pushManager.getSubscription(); if (sub) await sub.unsubscribe(); } catch {}
    await rpc("slicer_save_push", { p_sub: null });
    store.del("push_on"); toast("ההתראות כבויות"); go(home);
  }));
}
async function enablePush() {
  const perm = await Notification.requestPermission();
  if (perm !== "granted") return toast("ההתראות לא אושרו. אפשר לאשר בהגדרות הדפדפן ← הרשאות ← התראות");
  const reg = await navigator.serviceWorker.ready;
  const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(VAPID_PUBLIC) });
  await rpc("slicer_save_push", { p_sub: sub.toJSON() });
  store.set("push_on", true);

}

async function shrink(file) {                        // photos go to the AI as ≤1600px JPEG
  const bmp = await createImageBitmap(file), k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(ok => c.toBlob(ok, "image/jpeg", 0.85));
}
function statsForDb(s) {
  const fits = Object.fromEntries(printers.map(p => [p.id, G.fits(s.size, p)]));
  const { mask, min, ...rest } = s;
  return { ...rest, fits, est_grams_hint: G.estimateGrams(s, { walls: 2, infill_pct: 15 }) };
}

// ---------- one project: steps, 3D view, questions, recommendation, approval ----------
async function project(id) {
  const [[p], [wait], jobs] = await Promise.all([db.get(`slicer_projects?id=eq.${id}&select=*`), db.get(`slicer_ai_queue?project_id=eq.${id}&select=*`),
    db.get(`slicer_jobs?project_id=eq.${id}&select=*&order=created_at.desc&limit=1`)]);
  if (!p) throw new Error("הפרויקט לא נמצא");
  const job = jobs[0] || null, pc = job && job.status === "queued" ? await pcOnline() : null;
  let tris = null;
  if (p.file_path) {
    tris = models.get(modelKey(p));
    if (!tris) { tris = await parseModel(await (await download(p.file_path)).arrayBuffer(), p.file_path); models.set(modelKey(p), tris); }
    // a new model from the PC comes with stats NULL: best orientation + stats here; marks of the previous model don't fit the new mesh
    if (!p.stats) {
      const best = G.bestOrientation(tris);
      Object.assign(p, { rotation: [best.rx, best.ry], stats: statsForDb(best.s), marks: [] });
      await setP(id, { rotation: p.rotation, stats: p.stats, marks: [] }).catch(() => {});
    }
  }
  return () => drawProject(p, tris, wait, job, pc);
}
const hash = s => { let x = 5381; for (let i = 0; i < s.length; i++) x = (x * 33 ^ s.charCodeAt(i)) >>> 0; return x.toString(36); };
const modelKey = p => p.file_path + "#" + hash(p.scad || "");      // a new model round may reuse the same file path
const b64 = s => { let bin = ""; for (const x of new TextEncoder().encode(s)) bin += String.fromCharCode(x); return btoa(bin); };
const running = job => !!job && (job.status === "queued" || job.status === "running");
function steps(p) {
  const idea = p.kind === "idea";
  const names = idea ? ["רעיון", "שיחה", "תוכנית", "מודל", "הדמיה", "המלצה", "אישור מנהל", "חיתוך", "הדפסה"] : ["קובץ", "הדמיה", "שיחה", "המלצה", "אישור מנהל", "חיתוך", "הדפסה"];
  let now;
  if (idea && !p.answers) now = 1;
  else if (idea && (!p.file_path || p.model_status === "modeling")) now = p.plan_ok ? 3 : 2;
  else now = (p.status === "printed" ? 7 : p.status === "approved" ? (p.gcode_path ? 6 : 5) : p.status === "pending_review" ? 4 : p.settings ? 3 : 2) + (idea ? 2 : 0);
  h(`<div class="steps">${names.map((n, i) => `<span class="${i < now ? "done" : i === now ? "now" : ""}">${i < now ? "✓ " : ""}${n}</span>`).join("")}</div>`);
}
function drawProject(p, tris, wait, job, pc) {
  const admin = me.role === "admin", mine = p.owner === me.user_id, idea = p.kind === "idea";
  const editable = mine && (p.status === "draft" || p.status === "returned");
  const canTune = editable || admin;                 // turn the model, mark spots
  const working = running(job) || p.model_status === "planning" || p.model_status === "modeling";
  const busy = (wait && !wait.failed) || working;    // AI or PC at work: no second request
  const chatty = !!p.chat || !p.questions;           // v2.1 chat; projects from before keep their question form
  bar(p.title || "פרויקט חדש", { back: true });
  steps(p);
  if (wait) waitingCard(p, wait, chatty && !!wait.step);   // a chat / concepts step waits inside the chat
  else { nowCard(p, admin, mine, job, pc); if (busy) watchJobs(p, job); }
  if (p.status === "returned") card("↩ מאיר החזיר לתיקון", "red", p.admin_notes || "בלי הערה");
  if (p.description) card("📝 התיאור", "line", p.description);
  if (p.image_path) { const img = h(`<img class="idea" alt="">`); download(p.image_path).then(b => img.src = URL.createObjectURL(b)).catch(() => img.remove()); }
  const talk = () => chatty ? chatBlock(p, editable && !working && !p.plan_ok, wait) : questionsBlock(p, editable && !busy && !p.plan_ok);
  if (idea) { talk(); planBlock(p, editable && !busy); }
  if (admin && !tris && (p.model_status === "model_failed" || p.status === "pending_review")) modelBlock(p);   // fallback: Meir uploads a model

  let s = null;
  if (tris) {
    const [rx, ry] = p.rotation || [0, 0];
    const pos = G.rotate(tris, rx, ry);
    s = G.analyze(pos);
    section("🧊 ההדמיה");
    const box = h(`<div class="viewer"><div class="hint">גררי לסיבוב · צביטה לזום · אדום = זווית מעל ${G.OVERHANG_DEG}° שצריכה תמיכה</div></div>`);
    const sp = p.settings && spoolOf(p.settings.printer, p.settings.slot);
    let marking = false;
    const form = document.createElement("div");
    mountViewer(box, pos, s, sp ? sp.color_hex : "#e8c26a", p.marks, tri => {
      if (!marking) return;
      form.innerHTML = "";
      const note = field("מה לשנות כאן? (למשל: לעבות, צבע אחר, לא צריך)", "text", "", form);
      const o = tri * 9, at = [0, 1, 2].map(k => Math.round((tris[o + k] + tris[o + 3 + k] + tris[o + 6 + k]) / 3));   // mm, in the model's own frame (for the AI)
      pill("📍 שמירת הסימון", "cyan", () => act(async () => {
        await setP(p.id, { marks: [...p.marks, { tri, at, note: note.value.trim() }] });
        go(project, p.id);
      }), form);
      note.focus();
    });
    if (canTune) {
      const save = (r) => act(async () => {
        await setP(p.id, { rotation: r, stats: statsForDb(G.analyze(G.rotate(tris, r[0], r[1]))) });
        go(project, p.id);
      });
      choices([["auto", "✨ כיוון אוטומטי"], ["x", "↻ סיבוב קדימה"], ["y", "↻ סיבוב לצד"], ["mark", "📍 סמני מקום"]], "", (v, b) => {
        if (v === "auto") { const best = G.bestOrientation(tris); return save([best.rx, best.ry]); }
        if (v === "x") return save([(rx + 1) % 4, ry]);

        marking = !marking; b.classList.toggle("sel", marking); box.classList.toggle("marking", marking);
        toast(marking ? "געי במודל במקום שאת רוצה לסמן" : "סימון כבוי");
      });

    });

  }

  if (!idea) talk();
  if (p.settings) settingsBlock(p);
  if (admin && p.status === "pending_review" && tris) reviewBlock(p, s);
  actionsBlock(p, editable && !busy, s, job);
}

// something runs on the AI or the PC: check every 10 s and pop up when it's done
function watchJobs(p, job) {
  const my = screen, sig = (q, j) => `${q.model_status}|${q.gcode_path}|${j?.id}|${j?.status}`, was = sig(p, job);
  screenTimer = setInterval(async () => {
    if (my !== screen) return clearInterval(screenTimer);
    try {
      const [[q], [j]] = await Promise.all([db.get(`slicer_projects?id=eq.${p.id}&select=model_status,gcode_path`), db.get(`slicer_jobs?project_id=eq.${p.id}&select=id,kind,status&order=created_at.desc&limit=1`)]);
      if (my !== screen || sig(q, j) === was) return;
      clearInterval(screenTimer);
      const open = () => go(project, p.id);
      if (q.gcode_path && !p.gcode_path) return popup("📥 קובץ ההדפסה מוכן", p.title || "", "להורדה", open);
      if (q.model_status === "model_ready" && p.model_status !== "model_ready") return popup("🧊 המודל מוכן!", "אפשר לראות אותו בהדמיה", "לצפייה", open);
      if (q.model_status === "model_failed" || j?.status === "error") return popup("⚠️ משהו לא הצליח", p.title || "", "לפרטים", open);
      open();

}

const AI_WORK = { questions: "🧭 המתכנן מנסח שאלות…", settings: "🛠️ מהנדס ההדפסה בוחר הגדרות…", plan: "📐 ה-AI מתכנן — חלקים, מידות וסקיצה…", model: "✍️ ה-AI כותב את המודל ושולח למחשב…" };
async function aiStep(p, action, extra) {
  const w = card(AI_WORK[action] || "🔄 שולח שוב ל-AI…", "cyan", "אפשר לחכות כאן.");
  progress(w, action === "model" ? 90 : 60);

    const r = await ai(action, p.id, extra);

function progress(el, expect) {
  const p = h(`<div class="prog"><div><b></b></div><span></span></div>`, el), bar = p.querySelector("b"), txt = p.querySelector("span"), t0 = Date.now();
  const tick = () => {
    if (!p.isConnected) return clearInterval(id);
    const s = Math.round((Date.now() - t0) / 1000);
    bar.style.width = Math.min(95, 100 * (1 - Math.exp(-s / expect))) + "%";
    txt.textContent = s < expect ? `⏱ ${s} שניות · בדרך כלל עד ${expect}` : `⏱ ${s} שניות · לוקח יותר מהרגיל — עדיין עובד, אפשר לחכות`;
  };
  const id = setInterval(tick, 1000); tick();
}
// ---------- the assistant chat (v2.1): one question per turn, quick replies, free text and photos; ideas end with 3 concept sketches ----------

const bubble = (box, who, text) => h(`<div class="bubble ${who}">${esc(text)}</div>`, box);
function chatBlock(p, editable, wait) {

  if (clOn) {

  if (idea && done) {
    if (p.concepts) {
      const b = h(`<div class="bubble bot wide">🎨 הכנתי לך ${p.concepts.items.length} סקיצות — איזו הכי קרובה למה שדמיינת?<div class="concepts">${p.concepts.items.map((c, i) =>
        `<button data-i="${i}" class="${chosen?.a.startsWith(c.title + " —") ? "sel" : ""}"><img alt="" src="data:image/svg+xml;base64,${b64(c.svg)}"><b>${esc(c.title)}</b><small>${esc(c.note)}</small></button>`).join("")}</div></div>`, box);

  const row = h(`<div class="chat-input"><button class="icon-btn" aria-label="צירוף תמונה">📷</button><input placeholder="${done ? "רוצה להוסיף משהו? כתבי כאן" : "כתבי תשובה…"}" enterkeyhint="send"><button class="icon-btn" aria-label="שליחה" style="transform:scaleX(-1)">➤</button><input type="file" accept="image/*" hidden></div>`);
  const [cam, text, go2, file] = row.children;

  go2.onclick = fromText;
  text.onkeydown = e => { if (e.key === "Enter") fromText(); };

// one turn: her bubble + typing dots now; a closing turn goes straight on to the sketches (idea) or the settings (file)
async function chatSend(p, box, { message = "", file = null, action = "chat", finish = false }) {
  if (box.classList.contains("sending")) return;
  box.classList.add("sending");
  box.parentElement.querySelectorAll(".chat-input button, .chat-input input, .chat .choices button, .chat > .pill").forEach(x => x.disabled = true);
  if (message || file) { const b = bubble(box, "me", message); if (file) h(`<img alt="" src="${URL.createObjectURL(file)}">`, b); }
  const typing = (text = "") => { const t = h(`<div class="bubble bot typing">${esc(text || "חושב")} <i></i><i></i><i></i></div>`, box); progress(t, text ? 60 : 30); t.scrollIntoView({ behavior: "smooth", block: "center" }); return t; };
  let t = typing(action === "concepts" ? "🎨 מצייר 3 סקיצות" : "");
  try {
    let image;
    if (file) { image = `${p.id}/chat-${Date.now()}.jpg`; await upload(image, await shrink(file)); }
    const r = await ai(action, p.id, action === "chat" ? { message, image, finish } : {});
    if (r?.done) {
      t.remove(); bubble(box, "bot", r.reply);
      t = typing(p.kind === "idea" ? "🎨 מצייר 3 סקיצות" : "🛠️ בוחר הגדרות הדפסה");
      await ai(p.kind === "idea" ? "concepts" : "settings", p.id);
    }
  } catch (e) { toast(errText(e)); }
  go(project, p.id);
}
async function pickConcept(p, c, note) {
  const answers = [...p.answers.filter(a => a.q !== CONCEPT_Q), { q: CONCEPT_Q, a: c ? `${c.title} — ${c.note}` : `אף אחת — ${note}` }];
  await act(async () => { await setP(p.id, { answers }); await aiStep(p, "plan"); });
}

// filament rules: a spool keeps ≥ 50 g after the print; a spool of the same material and colour on the same printer can be joined as backup
function joinCandidates(printer, slot) {
  const sp = spoolOf(printer, slot);
  return sp ? spools.filter(x => x.printer_id === printer && x.slot !== slot && x.material === sp.material && String(x.color_hex).toLowerCase() === String(sp.color_hex).toLowerCase()) : [];
}
function joinTip(printer, slot, other) {
  return printer === "mk4s" ? `יש גליל זהה (חומר וצבע) ב-T${other}. אפשר לחבר אותם עם Spool join של ה-MMU3 (בהגדרות המדפסת / PrusaSlicer) — כשגליל T${slot} נגמר, המדפסת ממשיכה מ-T${other}.`
    : `יש גליל זהה (חומר וצבע) ב-T${other}. אם המדפסת תומכת במעבר אוטומטי לגליל זהה כשהגליל נגמר — אפשר לחבר ביניהם.`;
}
function gramsCheck(s, grams) {
  const sp = spoolOf(s.printer, s.slot), bk = s.backup_slot ? spoolOf(s.printer, s.backup_slot) : null;
  const have = Number(sp?.grams_left ?? 0) + Number(bk?.grams_left ?? 0);
  return { ok: !!sp && grams + SPARE <= have,
    msg: `${sp ? `בגליל T${s.slot} נשארו ${Math.round(sp.grams_left)} גרם` : "אין גליל מוגדר"}${bk ? ` ועוד ${Math.round(bk.grams_left)} בגליל הגיבוי T${bk.slot}` : ""}, וההדפסה צריכה ~${Math.round(grams)} גרם + ${SPARE} גרם רזרבה` };
}

// admin fallback (the AI/PC couldn't make the model): upload the STL/3MF/OBJ made for it; it goes back to her as a draft with the preview

  const finish = (status) => act(async () => {

    const sp = spoolOf(cur.printer, cur.slot), est = p.stats ? G.estimateGrams(p.stats, cur, sp ? sp.material : "PLA") : null;
    if (status === "approved" && est != null && !gramsCheck(cur, est).ok) return toast(`${gramsCheck(cur, est).msg}. בחר גליל אחר או גליל גיבוי.`);
    await setP(p.id, { status, settings: cur, admin_notes: text, reviewed_at: new Date().toISOString(), est_grams: est });
    if (lesson.checked && text) await db.add("slicer_lessons", { project_id: p.id, text });
    let sliced = status === "approved";
    if (sliced) await rpc("slicer_enqueue_slice", { p_project: p.id }).catch(e => { sliced = false; toast("אושר, אבל לא נשלח לחיתוך: " + errText(e)); });
    notify(p.id);
    if (status === "returned") toast("הוחזר לתיקון"); else if (sliced) toast("אושר ✓ נשלח לחיתוך במחשב");
    go(project, p.id);

}

function actionsBlock(p, editable, s, job) {
  const admin = me.role === "admin";
  if (editable && p.settings && p.file_path) {
    const high = (p.settings.risks || []).some(r => r.level === "high");
    const g = p.est_grams != null ? gramsCheck(p.settings, p.est_grams) : { ok: true }, sp = spoolOf(p.settings.printer, p.settings.slot);
    const join = !g.ok && sp && joinCandidates(p.settings.printer, p.settings.slot).find(x => Number(sp.grams_left) + Number(x.grams_left) >= p.est_grams + SPARE);
    if (!g.ok) card(join ? "🔗 צריך לחבר גליל גיבוי" : "🧵 אין מספיק חומר בגליל", join ? "gold" : "red",
      `${g.msg}.\n${join ? `יש גליל זהה ב-T${join.slot} — מאיר יחבר אותם באישור.` : "בקשי ממאיר להחליף גליל, או בקשי המלצה חדשה."}`);
    pill("📤 שליחה לאישור מנהל", "gold", () => act(async () => {
      if (!g.ok && !join) return toast("אין מספיק חומר בגליל — ההסבר למעלה");
      await handOver(p, { status: "pending_review" }, "נשלח למאיר ✓");
    }));
    if (high) label("יש סיכון גבוה בהמלצה — מאיר יראה אותו בבדיקה.");
  }
  if (p.status === "approved") {
    card("✅ אושר" + (p.admin_notes ? " — " + p.admin_notes : ""), "cyan", "כשההדפסה מסתיימת, סמני כאן אם הצליחה — והחומר יירד מהמלאי.");
    if (p.gcode_path) gcodeCard(p);
    else if (admin && !running(job)) pill(job?.kind === "slice" && job.status === "error" ? "🔁 לנסות לחתוך שוב" : "🔪 חיתוך לקובץ מדפסת", "gold", () => act(async () => {
      await rpc("slicer_enqueue_slice", { p_project: p.id });
      toast("נשלח לחיתוך במחשב ✓"); go(project, p.id);
    }));
    printResultBlock(p);
  }
  if (p.status === "printed") card("🎉 הודפס", "green", p.printed_at ? ddmm(p.printed_at) : "");
  if (editable || admin) {
    let sure = false;
    const del = link("🗑️ מחיקת הפרויקט", () => act(async () => {
      if (!sure) { sure = true; del.textContent = "למחוק לגמרי? לחצי שוב"; return; }
      const paths = [p.file_path, p.image_path, p.gcode_path].filter(Boolean);
      if (paths.length) await fetch(`${SUPABASE_URL}/storage/v1/object/slicer`, { method: "DELETE", headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + await token(), "Content-Type": "application/json" }, body: JSON.stringify({ prefixes: paths }) }).catch(() => {});
      await db.del(`slicer_projects?id=eq.${p.id}`);   // files first: only the project's owner may delete them, checked against the project row
      toast("נמחק"); go(home);
    }));
  }
}

// the sliced file: real grams per tool and time from the slicer, download to the phone with its own name
const hhmm = min => { const hh = Math.floor(min / 60), mm = Math.round(min % 60); return hh ? `${hh} ש' ${mm} ד'` : `${mm} דקות`; };
function gcodeCard(p) {
  const m = p.gcode_meta || {}, s = p.settings;
  const { c, add } = rowsCard("📥 קובץ ההדפסה מוכן", "green");
  add("קובץ", `<span style="direction:ltr;unicode-bidi:embed">${esc(p.gcode_name || "")}</span>`);
  if (m.time_min != null) add("זמן הדפסה", esc(hhmm(m.time_min)));
  for (const [t, g] of Object.entries(m.grams_per_tool || {})) {
    const slot = Number(t.replace(/\D/g, "")), sp = spoolOf(s.printer, slot);
    const ok = gramsCheck({ ...s, slot, backup_slot: slot === s.slot ? s.backup_slot : null }, Number(g)).ok;
    add(`חומר ${t}`, `${sp ? `<span class="dot" style="background:${esc(sp.color_hex)}"></span>` : ""}${Math.round(g)} גרם <span class="${ok ? "ok" : "bad"}">(${sp ? `נשארו ${Math.round(sp.grams_left)}` : "אין גליל"})</span>`);
  }
  if (m.slicer?.name) add("נחתך ב", esc(`${m.slicer.name} ${m.slicer.version || ""}`));
  pill("📥 הורדה לטלפון", "green", () => act(async () => {
    const name = p.gcode_name || p.gcode_path.split("/").pop();
    await saveFile(p.gcode_path, name);
    toast("ההורדה התחילה ✓ " + name);
  }), c);
}
// printed OK → everything comes off the spool; failed at ~N% → only that share, and it can be printed again
function printResultBlock(p) {
  const tools = p.gcode_meta?.grams_per_tool, total = tools ? Object.values(tools).reduce((a, b) => a + Number(b), 0) : p.est_grams;
  const mark = pct => act(async () => {
    const left = await rpc("slicer_mark_printed", pct ? { p_id: p.id, p_failed_pct: pct } : { p_id: p.id });
    const used = total != null ? Math.round(total * (pct || 100) / 100) : null;
    toast(left == null || used == null ? (pct ? "נרשם" : "סומן כהודפס") : `${pct ? `נרשם ${pct}%: ` : ""}ירדו ~${used} גרם. נשארו ${Math.round(left)} גרם בגליל`);
    go(project, p.id);
  });
  pill("🖨️ הודפס בהצלחה", "green", () => mark(null));
  let box = null;
  const fail = pill("⚠️ נכשל באמצע", "red", async () => {
    if (box) return;
    box = document.createElement("div"); fail.after(box);
    label("בערך כמה אחוז הודפס לפני שנכשל?", box);
    let pct = 0;
    const row = choices([10, 20, 30, 40, 50, 60, 70, 80, 90].map(v => [String(v), v + "%"]), "", (v, b) => {
      pct = Number(v); row.querySelectorAll("button").forEach(x => x.classList.toggle("sel", x === b));
      info.textContent = total != null ? `ירדו מהמלאי ~${Math.round(total * pct / 100)} גרם` : "";
    });
    box.appendChild(row);
    const info = label("", box);
    pill("✔️ לרשום ולהוריד מהמלאי", "red", () => pct ? mark(pct) : toast("בחרי בערך כמה אחוז הודפס"), box);
  });
}

// ---------- admin: filament per printer — how many spools, then material / colour / brand / catalog name / grams per slot ----------
function spoolSvg(color, slot) {
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="#2a3566" stroke="#9aa3c7" stroke-width="3"/>
    <circle cx="50" cy="50" r="38" fill="${esc(color)}"/>${[0, 1, 2, 3, 4].map(i => `<circle cx="50" cy="50" r="${36 - i * 3.4}" fill="none" stroke="#0002" stroke-width="1"/>`).join("")}
    <circle cx="50" cy="50" r="17" fill="#1d2753" stroke="#9aa3c7" stroke-width="2"/><text x="50" y="56" text-anchor="middle" font-size="16" fill="#f2c45c" font-weight="700">T${slot}</text></svg>`;
}
function drawSpools() {
  label("כמה גלילים יש בכל מדפסת, ומה בכל אחד. החומר יורד אוטומטית מכל הדפסה שמסומנת 'הודפס'.");
  for (const pr of printers) {
    const box = h(`<div class="card" style="--accent:var(--cyan)"></div>`);
    const mine = spools.filter(s => s.printer_id === pr.id);
    const st = { mmu: pr.mmu, count: Math.max(1, mine.length), slots: [1, 2, 3, 4, 5].map(i => ({ material: "PLA", color_hex: "#ffffff", color_name: "", color_code: "", brand: "", product: "", grams_left: 1000, ...(mine.find(s => s.slot === i) || {}) })) };
    drawPrinter(box, pr, st);
  }
}
function drawPrinter(box, pr, st) {
  const max = pr.id === "mk4s" ? (st.mmu ? 5 : 1) : 4;
  st.count = Math.min(st.count, max);
  box.innerHTML = `<b>🖨️ ${esc(pr.name)}</b>`;
  const inner = (html) => h(html, box);
  if (pr.id === "mk4s") {
    const r = inner(`<div class="choices"><button data-v="1" class="${st.mmu ? "sel" : ""}">עם MMU3</button><button data-v="0" class="${st.mmu ? "" : "sel"}">בלי MMU3</button></div>`);
    r.querySelectorAll("button").forEach(b => b.onclick = () => { st.mmu = b.dataset.v === "1"; drawPrinter(box, pr, st); });
  }
  inner(`<div class="label">כמה גלילים טעונים?</div>`);
  const cnt = inner(`<div class="choices">${Array.from({ length: max }, (_, i) => `<button data-v="${i + 1}" class="${st.count === i + 1 ? "sel" : ""}">${i + 1}</button>`).join("")}</div>`);
  cnt.querySelectorAll("button").forEach(b => b.onclick = () => { st.count = Number(b.dataset.v); drawPrinter(box, pr, st); });
  const grid = inner(`<div class="spools"></div>`);
  st.slots.slice(0, st.count).forEach((s, i) => {
    const cell = h(`<div class="spool">${spoolSvg(s.color_hex, i + 1)}
      <select aria-label="סוג חומר">${G.MATERIALS.map(m => `<option ${m === s.material ? "selected" : ""}>${esc(m)}</option>`).join("")}</select>
      <small>צבע</small><input type="color" value="${esc(s.color_hex)}">
      <input placeholder="שם הצבע" value="${esc(s.color_name)}">
      <input placeholder="מספר צבע" value="${esc(s.color_code)}">
      <input placeholder="חברה" value="${esc(s.brand)}">
      <input placeholder="שם קטלוגי" value="${esc(s.product)}">
      <small>גרם שנשארו</small><input type="number" inputmode="numeric" min="0" step="10" value="${esc(Math.round(s.grams_left))}"></div>`, grid);
    const [mat] = cell.querySelectorAll("select"), [color, cname, ccode, brand, product, grams] = cell.querySelectorAll("input");
    mat.onchange = () => s.material = mat.value;
    color.oninput = () => { s.color_hex = color.value; cell.querySelector("svg circle:nth-of-type(2)").setAttribute("fill", color.value); };
    cname.oninput = () => s.color_name = cname.value.trim();
    ccode.oninput = () => s.color_code = ccode.value.trim();
    brand.oninput = () => s.brand = brand.value.trim();
    product.oninput = () => s.product = product.value.trim();
    grams.oninput = () => s.grams_left = Math.max(0, Number(grams.value) || 0);
  });
  pill("💾 שמירה", "cyan", () => act(async () => {
    const rows = st.slots.slice(0, st.count).map((s, i) => ({ printer_id: pr.id, slot: i + 1, material: s.material, color_hex: s.color_hex, color_name: s.color_name,
      color_code: s.color_code, brand: s.brand, product: s.product, grams_left: s.grams_left, updated_at: new Date().toISOString() }));
    await http("POST", "/rest/v1/slicer_spools?on_conflict=printer_id,slot", rows, await token(), { Prefer: "resolution=merge-duplicates,return=minimal" });
    await db.del(`slicer_spools?printer_id=eq.${pr.id}&slot=gt.${st.count}`);
    await db.set(`slicer_printers?id=eq.${pr.id}`, { mmu: st.mmu, slots: st.count });
    pr.mmu = st.mmu; pr.slots = st.count;
    spools = await db.get("slicer_spools?select=*&order=printer_id,slot");
    toast(`${pr.name} נשמרה ✓`);
  }), box);
}

// ---------- admin popup: a project waiting for approval (checked every 20 s while the app is open) ----------
function startAdminPoll() {
  clearInterval(adminPoll);
  if (me?.role !== "admin") return;
  const tick = async () => {
    try {
      const rows = await db.get("slicer_projects?status=eq.pending_review&select=id,title,owner,updated_at,file_path&order=updated_at");
      const seen = store.get("seen") || {}, fresh = rows.find(r => seen[r.id] !== r.updated_at);
      if (!fresh || modal.innerHTML) return;
      seen[fresh.id] = fresh.updated_at; store.set("seen", seen);
      navigator.vibrate?.([120, 60, 120]);
      modal.innerHTML = `<div class="back"><div class="card"><b>📬 ${esc(names[fresh.owner] || "")} שלחה ${fresh.file_path ? "פרויקט לאישור" : "רעיון שמחכה למודל"}</b><span>${esc(fresh.title || "בלי שם")}</span></div></div>`;
      const c = modal.querySelector(".card");
      pill("לפתיחה", "gold", () => { modal.innerHTML = ""; go(project, fresh.id); }, c);
      link("אחר כך", () => modal.innerHTML = "", c);
    } catch {}
  };
  tick(); adminPoll = setInterval(tick, 20000);
}

// ---------- 3D: load STL / 3MF / OBJ into one triangle list, and the viewer ----------
let T = null;
async function three() {
  if (!T) {
    const [THREE, { OrbitControls }] = await Promise.all([import("three"), import("three/addons/controls/OrbitControls.js")]);
    T = { THREE, OrbitControls };
  }
  return T;
}
async function parseModel(buf, name) {
  await three();
  const ext = (name.split(".").pop() || "").toLowerCase(), geos = [];
  if (ext === "stl") {
    const { STLLoader } = await import("three/addons/loaders/STLLoader.js");
    geos.push(new STLLoader().parse(buf));
  } else {
    let root;
    if (ext === "obj") { const { OBJLoader } = await import("three/addons/loaders/OBJLoader.js"); root = new OBJLoader().parse(new TextDecoder().decode(buf)); }
    else if (ext === "3mf") { const { ThreeMFLoader } = await import("three/addons/loaders/3MFLoader.js"); root = new ThreeMFLoader().parse(buf); }
    else throw new Error("סוג קובץ לא נתמך — רק STL, 3MF או OBJ");
    root.position.set(0, 0, 0); root.rotation.set(0, 0, 0); root.scale.set(1, 1, 1); root.updateMatrixWorld(true);
    root.traverse(o => { if (o.isMesh) geos.push(o.geometry.clone().applyMatrix4(o.matrixWorld)); });
  }
  const parts = geos.map(g => (g.index ? g.toNonIndexed() : g).getAttribute("position").array);
  const total = parts.reduce((n, a) => n + a.length, 0);
  if (!total) throw new Error("לא נמצא מודל בקובץ");
  const out = new Float32Array(total);
  let o = 0; for (const a of parts) { out.set(a, o); o += a.length; }
  return out;
}
async function mountViewer(box, pos, s, color, marks, onTap) {
  let THREE, OrbitControls;
  try { ({ THREE, OrbitControls } = await three()); } catch { box.querySelector(".hint").textContent = "לא הצלחתי לטעון את ההדמיה — בדקי אינטרנט"; return; }
  if (!box.isConnected) return;
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(box.clientWidth, box.clientHeight);
  box.prepend(renderer.domElement);
  const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(40, box.clientWidth / box.clientHeight, 0.1, 20000);
  cam.up.set(0, 0, 1);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x334466, 1.7));
  const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(1, -1.5, 2.5); scene.add(sun);
  // the model sits on the plate (z = 0), centred
  const [sx, sy, sz] = s.size, mn = s.min, c = new Float32Array(pos.length);
  for (let i = 0; i < pos.length; i += 3) { c[i] = pos[i] - mn[0] - sx / 2; c[i + 1] = pos[i + 1] - mn[1] - sy / 2; c[i + 2] = pos[i + 2] - mn[2]; }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(c, 3)); geo.computeVertexNormals();
  const base = new THREE.Color(color), red = new THREE.Color("#ff4d5a"), col = new Float32Array(pos.length);
  for (let t = 0; t < s.mask.length; t++) { const k = s.mask[t] ? red : base; for (let v = 0; v < 3; v++) { col[t * 9 + v * 3] = k.r; col[t * 9 + v * 3 + 1] = k.g; col[t * 9 + v * 3 + 2] = k.b; } }
  geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.55, metalness: 0.05, side: THREE.DoubleSide }));
  scene.add(mesh);
  const R = Math.max(sx, sy, sz, 20), cells = Math.ceil(R * 1.6 / 10);
  const grid = new THREE.GridHelper(cells * 10, cells, 0x5fd4f4, 0x3a4578); grid.rotation.x = Math.PI / 2; scene.add(grid);
  const dotGeo = new THREE.SphereGeometry(R / 45, 12, 8), dotMat = new THREE.MeshBasicMaterial({ color: 0x5fd4f4 });
  for (const m of marks || []) {
    const o = m.tri * 9; if (o + 8 >= c.length) continue;
    const d = new THREE.Mesh(dotGeo, dotMat);
    d.position.set((c[o] + c[o + 3] + c[o + 6]) / 3, (c[o + 1] + c[o + 4] + c[o + 7]) / 3, (c[o + 2] + c[o + 5] + c[o + 8]) / 3);
    scene.add(d);
  }
  cam.position.set(R * 1.2, -R * 1.7, sz / 2 + R * 1.1);
  const ctl = new OrbitControls(cam, renderer.domElement);
  ctl.target.set(0, 0, sz / 2); ctl.update();
  const render = () => renderer.render(scene, cam);
  ctl.addEventListener("change", render);              // draw only when something moves (battery)
  // a short tap without dragging picks a triangle
  let down = null;
  renderer.domElement.addEventListener("pointerdown", e => down = { x: e.clientX, y: e.clientY, t: Date.now() });
  renderer.domElement.addEventListener("pointerup", e => {
    if (!down) return;
    const tap = Math.hypot(e.clientX - down.x, e.clientY - down.y) < 8 && Date.now() - down.t < 450; down = null;
    if (!tap) return;
    const r = renderer.domElement.getBoundingClientRect(), ray = new THREE.Raycaster();
    ray.setFromCamera(new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), cam);
    const hit = ray.intersectObject(mesh)[0];
    if (hit) onTap(hit.faceIndex);
  });
  const ro = new ResizeObserver(() => {
    const w = box.clientWidth, hh = box.clientHeight; if (!w || !hh) return;
    renderer.setSize(w, hh); cam.aspect = w / hh; cam.updateProjectionMatrix(); render();
  });
  ro.observe(box);
  render();
  view = { dispose() { ro.disconnect(); ctl.dispose(); geo.dispose(); dotGeo.dispose(); renderer.dispose(); } };
}

// ---------- "📲 הורדה לטלפון" (like the other family apps) ----------
let installEvt = null;
const standalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; });
window.addEventListener("appinstalled", () => { installEvt = null; document.querySelectorAll(".install-btn").forEach(b => b.remove()); toast("הותקן ✓ — פתחי מהמסך הראשי"); });
function installButton() {
  if (standalone()) return;
  const btn = pill("📲 הורדה לטלפון", "cyan", async () => {
    for (let i = 0; i < 40 && !installEvt; i++) await new Promise(r => setTimeout(r, 100));
    if (installEvt) { const ev = installEvt; ev.prompt(); const c = await ev.userChoice; if (c && c.outcome === "accepted") installEvt = null; return; }
    if (/android/i.test(navigator.userAgent) && !/Chrome\//.test(navigator.userAgent.replace(/SamsungBrowser.*/, ""))) {
      location.href = "intent://" + location.host + location.pathname + "#Intent;scheme=https;package=com.android.chrome;end"; return;
    }
    toast("בתפריט הדפדפן ⋮ בחרי 'התקנת אפליקציה' או 'הוספה למסך הבית'");
  });
  btn.classList.add("install-btn");
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

route();
