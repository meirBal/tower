<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pay or Wait</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pay or Wait">
<meta name="theme-color" content="#121a3a">
<style>
  /* same look as the Android app: dark navy + gold glow (light theme available in Settings) */
  :root { --bg1:#0e1430; --bg2:#1b2550; --tile1:#1d2753; --tile2:#141c40; --text:#f3eee2; --muted:#9aa3c7; --gold:#f2c45c; --cyan:#5fd4f4; --red:#ff4d5a; --line:#3a4578; --fs:1; }
  html.light { --bg1:#f7f3ea; --bg2:#ece5d4; --tile1:#ffffff; --tile2:#f4efe3; --text:#1d2240; --muted:#5d6488; --gold:#b8860b; --cyan:#127f9e; --red:#d0263a; --line:#cfc6b0; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { margin:0; min-height:100%; background:linear-gradient(var(--bg1),var(--bg2)) fixed var(--bg2); }
  body { margin:0; min-height:100%; }
  body { font-family:-apple-system,"Segoe UI",Rubik,Arial,sans-serif; color:var(--text);
         font-size:calc(16px * var(--fs)); padding:calc(env(safe-area-inset-top) + 10px) 18px calc(env(safe-area-inset-bottom) + 24px); }
  main { max-width:520px; margin:0 auto; }
  .bar { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .bar h1 { flex:1; margin:0; font-size:1.25em; font-weight:600; color:var(--gold); text-shadow:0 0 8px var(--gold); }
  .icon-btn { background:none; border:0; color:var(--gold); font-size:1.5em; padding:6px; cursor:pointer; }
  .brand { text-align:center; margin:36px 0 14px; }
  .brand img { width:84px; height:84px; border-radius:20px; box-shadow:0 0 24px rgba(242,196,92,.35); }
  .brand h2 { font-weight:300; font-size:1.9em; margin:12px 0 2px; }
  .muted { color:var(--muted); }
  .label { color:var(--muted); margin:6px 0; white-space:pre-line; }
  .section { color:var(--gold); font-weight:600; font-size:.82em; letter-spacing:.08em; margin:22px 0 4px; }
  .card { background:linear-gradient(var(--tile1),var(--tile2)); border:1.5px solid var(--accent,var(--gold)); box-shadow:0 0 10px -2px var(--accent,var(--gold));
          border-radius:22px; padding:14px 20px; margin-top:10px; }
  .card b { display:block; font-size:1.06em; font-weight:600; }
  .card span { color:var(--muted); font-size:.9em; white-space:pre-line; }
  button.pill { display:flex; width:100%; align-items:center; justify-content:center; gap:10px; margin-top:10px; padding:14px 18px; border-radius:999px;
          background:linear-gradient(var(--tile1),var(--tile2)); color:var(--text); font:inherit; font-size:1em; border:1.5px solid var(--accent,var(--gold));
          box-shadow:0 0 12px -3px var(--accent,var(--gold)); cursor:pointer; }
  button.pill:disabled { opacity:.5; }
  a.link, button.link { display:block; width:100%; text-align:center; color:var(--cyan); padding:12px; background:none; border:0; font:inherit; font-size:.92em; cursor:pointer; text-decoration:none; }
  input { width:100%; margin-top:10px; padding:14px 22px; border-radius:999px; border:1.5px solid var(--line); background:linear-gradient(var(--tile1),var(--tile2));
          color:var(--text); font:inherit; font-size:1em; outline:none; }
  input:focus { border-color:var(--gold); }
  .code { text-align:center; direction:ltr; font-size:2.6em; letter-spacing:.15em; font-weight:600; color:var(--gold); text-shadow:0 0 12px var(--gold);
          border:1.5px solid var(--gold); border-radius:28px; padding:20px 10px; margin-top:10px; background:linear-gradient(var(--tile1),var(--tile2)); user-select:all; }
  .bubble { background:linear-gradient(var(--tile1),var(--tile2)); border:1px solid var(--line); border-radius:18px; padding:10px 16px; margin:8px 0 0 28px; cursor:pointer; }
  .bubble b { color:var(--gold); font-size:.85em; font-weight:600; }
  .bubble div { color:var(--muted); font-size:.85em; white-space:pre-line; }
  .choices { display:flex; gap:6px; margin-top:4px; }
  .choices button { flex:1; padding:12px 4px; border-radius:999px; border:1.5px solid var(--line); background:linear-gradient(var(--tile1),var(--tile2)); color:var(--text); font:inherit; font-size:.9em; }
  .choices.tabs { overflow-x:auto; flex-wrap:nowrap; margin:6px 0 4px; }
  .choices.tabs button { flex:0 0 auto; padding:10px 16px; }
  .choices button.sel { border-color:var(--gold); color:var(--gold); box-shadow:0 0 8px -2px var(--gold); }
  .toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 28px); transform:translateX(-50%); background:#000c; color:#fff; padding:12px 18px;
           border-radius:14px; max-width:90%; font-size:.92em; z-index:50; text-align:center; }
  .ver { text-align:center; color:var(--muted); font-size:.7em; margin-top:22px; }
  /* the owner's 5-minute joke block */
  #prank { position:fixed; inset:0; background:#120a0af2; z-index:40; overflow:hidden; display:none; }
  #prank .msg { position:absolute; top:50%; left:50%; width:130%; transform:translate(-50%,-50%) rotate(-32deg); text-align:center; color:#fff; font-weight:800;
                font-size:clamp(34px,11vw,64px); line-height:1.2; text-shadow:0 0 22px #ff2d2d; white-space:pre-line; animation:beat 1s infinite; }
  #prank .timer { position:absolute; bottom:calc(env(safe-area-inset-bottom) + 70px); width:100%; text-align:center; direction:ltr; color:#ff2d2d;
                  font-weight:800; font-size:64px; text-shadow:0 0 18px #ff2d2d; }
  #prank .face { position:absolute; font-size:42px; width:56px; height:56px; line-height:56px; text-align:center; cursor:pointer; user-select:none;
                 transition:left 2.4s ease-in-out, top 2.4s ease-in-out, transform 2.4s ease-in-out; }
  #prank .boom { transition:transform .38s, opacity .38s !important; transform:scale(2.6) !important; opacity:0; }
  #prank .bit { position:absolute; font-size:18px; transition:transform .6s ease-out, opacity .6s; pointer-events:none; }
  @keyframes beat { 50% { transform:translate(-50%,-50%) rotate(-32deg) scale(1.06); } }
</style>
</head>
<body>
<main id="app"></main>
<div id="prank"><div class="msg">נחסמת בהיותך
ילד קקה 💩</div><div class="timer"></div></div>
<script>
"use strict";
// Pay or Wait — iPhone web version (members only). Same Supabase backend as the Android app.
const SUPABASE_URL = "https://enhqzgjqqyubgfysnjib.supabase.co";
const SUPABASE_KEY = "sb_publishable_w3aqbIxj_ECmMOUhANPebw_thGqD9o1";
const VAPID_PUBLIC = "BGqmEpQHwvDEXD9X5wpcbmuLUFe_0lGojHmijB4ky-ajBYdW87J7qhz-h0cEdiuuFpdQB2sveAbRcvrmLJKZowo";
const VERSION = "1.9";
const MIN_PASSWORD = 8;
const app = document.getElementById("app");
let pollTimer = null;
let onMemberScreen = false; // background refreshes only re-render this screen

// ---------- small helpers ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// (no lookbehind: older Safari can't parse it)
// the code is near the top (emails end with addresses and years), never inside a link
const codeOf = t => (String(t || "").replace(/https?:\/\/\S+/g, " ").slice(0, 400).match(/(?:^|\D)(\d{4,8})(?!\d)/) || [])[1] || null;
// links in forwarded emails (e.g. Netflix "get code") become tappable, shown by their site name
const linkify = t => String(t ?? "").split(/(https?:\/\/[^\s<>"'\]\)]+)/).map((p, i) => i % 2
  ? `<a href="${esc(p)}" target="_blank" rel="noopener">🔗 ${esc(p.split("/")[2])}</a>` : esc(p)).join("");
const hhmm = (iso, plusMin = 0) => new Date(new Date(iso).getTime() + plusMin * 60000).toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" });
const ddmm = iso => new Date(iso).toLocaleString("he-IL", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
const dmy = d => { const [y, m, dd] = d.slice(0, 10).split("-"); return `${dd}/${m}/${y.slice(2)}`; };
const money = v => Number(v) % 1 === 0 ? String(Number(v)) : Number(v).toFixed(2);
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}
async function copy(text, msg) {
  try { await navigator.clipboard.writeText(text); toast(msg); } catch { toast("לא הצלחתי להעתיק"); }
}
const store = {
  get: k => { try { return JSON.parse(localStorage.getItem("pow_" + k)); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem("pow_" + k, JSON.stringify(v)); } catch {} },
  del: k => { try { localStorage.removeItem("pow_" + k); } catch {} },
};

// ---------- settings (theme + font size, like the Android app) ----------
function applyLook() {
  const theme = store.get("theme") || "system";
  const dark = theme === "dark" || (theme === "system" && !matchMedia("(prefers-color-scheme: light)").matches);
  document.documentElement.classList.toggle("light", !dark);
  document.documentElement.style.setProperty("--fs", store.get("fs") || 1);
}
applyLook();

// ---------- Supabase (plain fetch, like the Android app) ----------
class ApiError extends Error { constructor(code, msg) { super(msg); this.code = code; } }
async function http(method, path, body, token) {
  const h = { apikey: SUPABASE_KEY, "Content-Type": "application/json" };
  if (token) h.Authorization = "Bearer " + token;
  if (path.startsWith("/rest/v1/pow_profiles")) h.Prefer = "resolution=merge-duplicates";
  let r;
  try { r = await fetch(SUPABASE_URL + path, { method, headers: h, body: body == null ? undefined : JSON.stringify(body) }); }
  catch { throw new ApiError(0, "אין חיבור לשרת — בדוק אינטרנט ונסה שוב"); }
  const text = await r.text();
  if (!r.ok) throw new ApiError(r.status, text);
  return text ? JSON.parse(text) : null;
}
function saveSession(j) {
  store.set("session", { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Math.floor(Date.now() / 1000) + j.expires_in, user_id: j.user.id });
}
let refreshing = null;
async function token() {
  const s = store.get("session");
  if (!s) throw new ApiError(401, "not logged in");
  if (Date.now() / 1000 < s.expires_at - 60) return s.access_token;
  refreshing ??= http("POST", "/auth/v1/token?grant_type=refresh_token", { refresh_token: s.refresh_token }).then(saveSession).finally(() => refreshing = null);
  await refreshing;
  return store.get("session").access_token;
}
const loggedIn = () => !!store.get("session");
const rpc = async (fn, args = {}) => http("POST", "/rest/v1/rpc/" + fn, args, await token());
const fnCall = async body => http("POST", "/functions/v1/pow", body, await token());
const saveProfile = async fields => http("POST", "/rest/v1/pow_profiles", { id: store.get("session").user_id, ...fields }, await token());

function errText(e) {
  const m = String(e && e.message || e);
  if (/unpaid/.test(m)) return "חסום — התשלום לשירות הזה לא עודכן";
  if (/pranked/.test(m)) return "נחסמת ל-5 דקות 😜";
  if (/too_fast/.test(m)) return "רגע... נסה שוב בעוד חצי דקה";
  if (/no_access/.test(m)) return "אין לך גישה לשירות הזה";
  if (/code_not_found/.test(m)) return "הקוד לא נמצא";
  if (/Invalid login/.test(m)) return "אימייל או סיסמה שגויים";
  if (/Email not confirmed/.test(m)) return "צריך קודם לאשר את מייל האימות";
  if (/already registered|user_already_exists/.test(m)) return "המייל הזה כבר רשום — לחץ 'התחברות'";
  if (/email_address_invalid|invalid format/.test(m)) return "כתובת המייל לא תקינה";
  if (e instanceof ApiError && e.code) return `שגיאה ${e.code}: ${m.slice(0, 150)}`;
  return m;
}
async function act(work) { try { await work(); } catch (e) { toast(errText(e)); } }

// ---------- push (iPhone: works only from the home-screen app, iOS 16.4+) ----------
const standalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
function b64ToBytes(s) {
  const pad = "=".repeat((4 - s.length % 4) % 4), raw = atob((s + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(raw, c => c.charCodeAt(0));
}
async function enablePush() {
  if (!pushSupported()) return toast(standalone() ? "הטלפון לא תומך בהתראות (צריך iOS 16.4 ומעלה)" : "קודם הוסף למסך הבית (שתף ← הוסף למסך הבית) ופתח משם");
  const perm = await Notification.requestPermission();
  if (perm !== "granted") return toast("ההתראות לא אושרו. אפשר לאשר בהגדרות ← התראות ← Pay or Wait");
  const reg = await navigator.serviceWorker.ready;
  const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(VAPID_PUBLIC) });
  await saveProfile({ web_push: sub.toJSON() });
  store.set("push_on", true);
  toast("התראות פועלות ✓");
  route();
}
async function disablePush() {
  try { const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription(); if (sub) await sub.unsubscribe(); } catch {}
  await saveProfile({ web_push: null });
  store.del("push_on");
  toast("ההתראות כבויות");
  route();
}
const pushOn = () => pushSupported() && Notification.permission === "granted" && store.get("push_on");

// ---------- "📲 הורד לטלפון" (like the tower game): real install prompt on Android Chrome, steps on iPhone ----------
let installEvt = null;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; document.querySelectorAll(".install-btn").forEach(b => b.hidden = false); });
window.addEventListener("appinstalled", () => { installEvt = null; document.querySelectorAll(".install-btn,.install-steps").forEach(b => b.remove()); toast("הותקן ✓ — פתח את Pay or Wait מהמסך הראשי"); });
function installButton() {
  if (standalone()) return; // already running as an app
  const btn = pill("📲 הורד לטלפון", "gold", async () => {
    // Chrome hands over the install dialog a few seconds after the page loads: wait for it instead of showing steps
    for (let i = 0; i < 40 && !installEvt && !isIOS(); i++) await new Promise(r => setTimeout(r, 100));
    if (installEvt) {
      const ev = installEvt;
      ev.prompt();
      const c = await ev.userChoice;
      if (c && c.outcome === "accepted") installEvt = null;
      return;
    }
    if (app.querySelector(".install-steps")) return;
    // Android but no install dialog: not Chrome (WhatsApp / Samsung browser) — reopen the page in Chrome
    const ua = navigator.userAgent;
    if (/android/i.test(ua) && (/SamsungBrowser|; wv\)|FBAN|FBAV|Instagram/.test(ua) || !/Chrome\//.test(ua))) {
      location.href = "intent://" + location.host + location.pathname + "#Intent;scheme=https;package=com.android.chrome;end";
      return;
    }
    const steps = isIOS()
      ? "1. לחץ על כפתור השיתוף של ספארי ⬆️ (ריבוע עם חץ למעלה)\n2. בחר 'הוסף למסך הבית'\n3. פתח את Pay or Wait מהאייקון ולחץ 'הפעל התראות'"
      : "1. פתח את תפריט הדפדפן ⋮ (למעלה)\n2. בחר 'התקנת אפליקציה' או 'הוספה למסך הבית'\n3. פתח את Pay or Wait מהאייקון ולחץ 'הפעל התראות'";
    const c = card("📲 הורדה לטלפון", "cyan", steps + "\n\nבלי קובץ להתקנה ובלי הרשאות מיוחדות.");
    c.classList.add("install-steps");
    btn.after(c);
  });
  btn.classList.add("install-btn");
}

// ---------- UI building ----------
function h(html) { app.insertAdjacentHTML("beforeend", html); return app.lastElementChild; }
function clear() { clearTimeout(pollTimer); onMemberScreen = false; app.innerHTML = ""; }
function bar(title, { settings = false, back = false } = {}) {
  const el = h(`<div class="bar">${back ? `<button class="icon-btn" aria-label="חזרה">→</button>` : ""}<h1>${esc(title)}</h1>${settings ? `<button class="icon-btn" aria-label="הגדרות">⚙︎</button>` : ""}</div>`);
  if (back) el.firstElementChild.onclick = () => route();
  if (settings) el.lastElementChild.onclick = showSettings;
}
const label = t => h(`<div class="label">${esc(t)}</div>`);
const section = t => h(`<div class="section">${esc(t)}</div>`);
function card(head, accent, body, onClick) {
  const el = h(`<div class="card" style="--accent:var(--${accent})"><b>${esc(head)}</b>${body ? `<span>${esc(body)}</span>` : ""}</div>`);
  if (onClick) { el.style.cursor = "pointer"; el.onclick = onClick; }
  return el;
}
function pill(text, accent, onClick) {
  const el = h(`<button class="pill" style="--accent:var(--${accent})">${esc(text)}</button>`);
  el.onclick = async () => { el.disabled = true; try { await onClick(); } finally { el.disabled = false; } };
  return el;
}
function link(text, onClick) { const el = h(`<button class="link">${esc(text)}</button>`); el.onclick = onClick; return el; }
function field(placeholder, type = "text", auto = "") { return h(`<input type="${type}" placeholder="${esc(placeholder)}" ${auto ? `autocomplete="${auto}"` : ""}>`); }
const codeBox = t => h(`<div class="code">${esc(t)}</div>`);
function footer() { h(`<div class="ver">גרסת אתר ${VERSION}</div>`); }

// ---------- screens ----------
async function route(quiet = false) {
  if (location.hash.includes("type=recovery")) return showNewPassword();
  if (!loggedIn()) { clear(); return showLogin(); }
  if (!quiet) { clear(); label("טוען…"); }
  try {
    // "I'm the manager" shows my own group (listed first by the server); "I'm a user" shows the group I opened
    const mode0 = store.get("mode");
    const s = await rpc("pow_state", { p_group: mode0 === "member" ? store.get("group") || null : null });
    const owns = (s.groups || []).some(g => g.role === "owner");
    if (!mode0) store.set("mode", owns ? "owner" : "member");
    const opened = store.get("group");
    clear();
    if (store.get("mode") === "owner") showOwnerHere(s, owns);
    else if (opened && opened === s.group_id && s.role === "member") showMember(s);
    else if (opened && opened === s.group_id && s.role === "pending") showPending(s);
    else showMyGroups(s);
  } catch (e) {
    if (e instanceof ApiError && (e.code === 400 || e.code === 401) && /refresh|JWT|not logged/i.test(e.message)) { store.del("session"); return route(); }
    clear(); label(errText(e)); pill("נסה שוב", "gold", () => route()); link("התנתקות", signOut);
  }
  footer();
}

function showLogin() {
  h(`<div class="brand"><img src="icon-180.png" alt=""><h2>Pay or Wait</h2><div class="muted">קודי כניסה לחשבונות המשפחתיים</div></div>`);
  installButton();
  const name = field("שם (בהרשמה)", "text", "name");
  const email = field("אימייל", "email", "email");
  const pass = field("סיסמה (לפחות 8 תווים)", "password", "current-password");
  const missing = () => { if (!email.value.trim()) return toast("כתוב אימייל"), true; if (!pass.value) return toast("כתוב סיסמה"), true; return false; };
  const saveName = async () => { const n = name.value.trim(); if (n) await saveProfile({ display_name: n }); };
  pill("התחברות", "gold", () => act(async () => {
    if (missing()) return;
    saveSession(await http("POST", "/auth/v1/token?grant_type=password", { email: email.value.trim(), password: pass.value }));
    await saveName(); route();
  }));
  pill("הרשמה", "cyan", () => act(async () => {
    if (missing()) return;
    if (!name.value.trim()) return toast("כתוב שם, כדי שהמנהל ידע מי אתה");
    if (pass.value.length < MIN_PASSWORD) return toast(`הסיסמה צריכה לפחות ${MIN_PASSWORD} תווים`);
    const j = await http("POST", "/auth/v1/signup", { email: email.value.trim(), password: pass.value });
    if (!j.access_token) return toast("נשלח מייל אימות. אשר אותו ואז לחץ 'התחברות' (עם השם)");
    saveSession(j); await saveName(); route();
  }));
  link("שכחתי סיסמה", () => act(async () => {
    const e = email.value.trim();
    if (!e) return toast("כתוב קודם את האימייל");
    const redirect = encodeURIComponent(location.origin + location.pathname);
    await http("POST", `/auth/v1/recover?redirect_to=${redirect}`, { email: e });
    toast("נשלח מייל לאיפוס סיסמה. פתח את הקישור שבו");
  }));
}

// reset link lands here with #access_token=...&type=recovery
function showNewPassword() {
  clear();
  const p = new URLSearchParams(location.hash.slice(1));
  const access = p.get("access_token");
  bar("סיסמה חדשה");
  if (!access) { label("הקישור לא תקין או שפג תוקפו. בקש קישור חדש."); link("חזרה", () => { history.replaceState(null, "", location.pathname); route(); }); return; }
  const pass = field("סיסמה חדשה (לפחות 8 תווים)", "password", "new-password");
  pill("שמור סיסמה", "gold", () => act(async () => {
    if (pass.value.length < MIN_PASSWORD) return toast(`הסיסמה צריכה לפחות ${MIN_PASSWORD} תווים`);
    await http("PUT", "/auth/v1/user", { password: pass.value }, access);
    // the recovery link also carries a session: keep the user logged in
    const refresh = p.get("refresh_token"), uid = JSON.parse(atob(access.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).sub;
    if (refresh) store.set("session", { access_token: access, refresh_token: refresh, expires_at: Math.floor(Date.now() / 1000) + Number(p.get("expires_in") || 3600), user_id: uid });
    history.replaceState(null, "", location.pathname);
    toast("הסיסמה עודכנה ✓"); route();
  }));
}

// the two main modes: the group I manage, and the groups I'm a user in
function modeTabs(selected) {
  const row = h(`<div class="choices tabs"><button data-m="owner" class="${selected === "owner" ? "sel" : ""}">👑 אני מנהל</button><button data-m="member" class="${selected === "member" ? "sel" : ""}">👥 אני משתמש</button></div>`);
  row.querySelectorAll("button").forEach(b => b.onclick = () => {
    if (b.dataset.m === selected) return;
    store.set("mode", b.dataset.m); store.del("group"); route();
  });
}
const backToGroups = () => link("→ כל הקבוצות שלי", () => { store.del("group"); route(); });

// "I'm a user": every group I'm registered in, each opens its own page; plus join a new one
function showMyGroups(s) {
  bar("Pay or Wait", { settings: true });
  modeTabs("member");
  installButton();
  const mine = (s.groups || []).filter(g => g.role !== "owner");
  section("הקבוצות שלי");
  if (!mine.length) label("עוד לא הצטרפת לאף קבוצה.");
  for (const g of mine) {
    const pending = g.role === "pending";
    card(`${pending ? "⏳" : "👥"} הקבוצה של ${g.name || "?"}`, pending ? "muted" : "gold", pending ? "ממתין לאישור המנהל" : "לחץ לכניסה",
      () => { store.set("group", g.id); route(); });
  }
  section("הצטרפות לקבוצה");
  label("קיבלת קוד הצטרפות ממנהל של קבוצה? הזן אותו כאן.");
  const code = field("קוד הצטרפות");
  code.style.textTransform = "uppercase";
  pill("הצטרף", "gold", () => act(async () => { await rpc("pow_join", { p_code: code.value }); route(); }));
}

function showPending(s) {
  bar("Pay or Wait", { settings: true });
  modeTabs("member");
  backToGroups();
  installButton();
  label(`הבקשה נשלחה ✓ ממתין לאישור של ${s.owner_name || "המנהל"}.`);
  pill("רענן", "gold", () => route());
  link("בטל בקשה", () => act(async () => { await rpc("pow_leave", { p_group: s.group_id }); store.del("group"); route(); }));
}

function showOwnerHere(s, owns) {
  bar("Pay or Wait", { settings: true });
  modeTabs("owner");
  card(owns ? "👑 הקבוצה שאתה מנהל" : "עוד אין לך קבוצה שאתה מנהל", "gold",
    "ניהול הקבוצה והעברת הקודים נעשים מאפליקציית המנהל באנדרואיד (רק בטלפון שמקבל את ה-SMS).\nכאן, ב'👥 אני משתמש', נמצאות הקבוצות שאתה רשום בהן.");
}

function showMember(s) {
  bar("Pay or Wait", { settings: true });
  modeTabs("member");
  backToGroups();
  onMemberScreen = true;
  if (s.prank_until) return showPrank(s.prank_until);
  label(`הקבוצה של ${s.owner_name || "המנהל"}`);
  installButton();
  if (!pushOn()) card("🔔 הפעל התראות", "cyan", standalone() || !isIOS() ? "לחץ כאן כדי לקבל את הקוד גם כשהאפליקציה סגורה." : "באייפון התראות עובדות רק אחרי 'הורד לטלפון' ופתיחה מהאייקון.", () => act(enablePush));
  const names = Object.fromEntries(s.services.map(o => [o.id, o.name]));

  const req = s.requests[0];
  const myWaiting = req && req.status === "waiting" ? req.service_id : null;
  if (req) {
    const svc = names[req.service_id] || "";
    if (req.status === "waiting") {
      card(`⏳ ממתין לקוד ${svc} — השירות נעול עליך`, "cyan",
        `עכשיו בקש את הקוד מתוך ${svc}. כשה-SMS יגיע למנהל, הקוד יופיע כאן.\nהנעילה עד ${hhmm(req.created_at, 10)}, או עד שהקוד מגיע.`);
      pill("בטל המתנה", "muted", () => act(async () => { await fnCall({ action: "cancel", service_id: req.service_id }); route(true); }));
      pollTimer = setTimeout(() => route(true), 3000); // in case the push is late
    } else {
      const code = codeOf(req.body);
      section(`הקוד של ${svc}`);
      codeBox(code || "—");
      if (code) pill("העתק קוד", "gold", () => copy(code, "הקוד הועתק"));
      h(`<div class="label">${linkify(req.body)}</div>`);
    }
  }

  section("השירותים שלי");
  if (!s.services.length) label("המנהל עוד לא נתן לך גישה לשירות.");
  const today = new Date(); today.setHours(0, 0, 0, 0);
  for (const o of s.services) {
    const price = Number(o.price || 0);
    const until = o.paid_until ? new Date(o.paid_until + "T00:00:00") : null;
    const dueSoon = !o.blocked && until && (until - today) <= 7 * 86400000;
    // subscription status: always shown, whatever else is going on with the service
    const status = price <= 0 ? "✅ חינם"
      : o.blocked ? `❗ דרוש תשלום · ₪${money(price)} ${o.period === "year" ? "לשנה" : "לחודש"} · ` + (o.paid_until ? `התשלום הסתיים ב-${dmy(o.paid_until)}` : "עוד לא שולם")
      : `✅ שולם עד ${dmy(o.paid_until)}${dueSoon ? " ⏰" : ""}\nתשלום הבא: ₪${money(price)} (${o.period === "year" ? "שנתי" : "חודשי"}) עד ${dmy(o.paid_until)}`;
    if (o.blocked) {
      card(`🔒 ${o.name}`, "red", `${status}\nאין קודים עד שהמנהל יאשר את התשלום.`);
    } else if (o.busy) {
      card(`⛔ ${o.name} תפוס`, "muted", `${status}\n${o.busy.who || "מישהו"} ממתין לקוד עד ${hhmm(o.busy.until)}. ` +
        (o.queued ? "תקבל התראה כשיתפנה 🔔" : "רק אחד בכל פעם, כדי שהקודים לא יתחלפו."));
      if (!o.queued) pill("הודע לי כשמתפנה", "cyan", () => waitFor(o.id));
    } else if (o.id === myWaiting) {
      card(o.name, "gold", `${status}\n⏳ ממתין לקוד (למעלה)`);
    } else {
      card(o.name, "gold", status);
      pill(`ממתין לקוד — ${o.name}`, "gold", () => waitFor(o.id));
    }
    if (price > 0) {
      pill(`${o.blocked ? "💳 שלם עכשיו" : "💳 תשלום מנוי"} ₪${money(price)}${o.period === "year" ? " לשנה" : ""}`, o.blocked || dueSoon ? "red" : "line",
        () => pay(o.name, price, s.pay_phone, s.pay_link));
      // monthly service: a whole year in advance is also allowed (a yearly service is always paid per year)
      if (o.period !== "year") pill(`💳 שנה מראש ₪${money(price * 12)}`, "line", () => pay(`${o.name} (שנה מראש)`, price * 12, s.pay_phone, s.pay_link));
      if (o.blocked || dueSoon) pill("שילמתי — עדכן את המנהל", "gold", () => act(async () => {
        await fnCall({ action: "paid", service_id: o.id }); toast("המנהל קיבל הודעה ✓ — הוא מאשר אצלו והמנוי ממשיך");
      }));
    }
  }

  if (s.reminder_day) label(`🔔 תזכורת תשלום מגיעה כל ${s.reminder_day} לחודש (אם התשלום עומד להסתיים).`);
  if (s.history.length) {
    section("היסטוריית קודים (7 ימים)");
    for (const x of s.history) {
      if (!x.body) continue;
      const code = codeOf(x.body);
      const el = h(`<div class="bubble"><b>${esc(names[x.service_id] || "")} · ${esc(ddmm(x.delivered_at))}${code ? " · " + esc(code) : ""}</b><div>${linkify(x.body)}</div></div>`);
      el.onclick = e => !e.target.closest("a") && copy(code || x.body, code ? `הקוד ${code} הועתק` : "ההודעה הועתקה");
    }
  }
  pill("רענן", "line", () => route());
  link("עזוב קבוצה", () => { if (confirm("לעזוב את הקבוצה?")) act(async () => { await rpc("pow_leave", { p_group: s.group_id }); store.del("group"); route(); }); });
}

// Bit has no public link that pre-fills a transfer to a private person: the owner's own payment link if he set one,
// otherwise copy his number, show the amount, and open Bit where the phone allows it
async function pay(service, amount, phone, link) {
  if (link) { window.open(link, "_blank", "noopener"); return; }
  if (!phone) return toast("המנהל עוד לא הגדיר לאן משלמים");
  try { await navigator.clipboard.writeText(phone); } catch {}
  if (app.querySelector(".pay-steps")) return;
  const c = card(`💳 תשלום ${service}: ₪${money(amount)}`, "gold",
    `המספר של המנהל (${phone}) הועתק.\nבביט: העברת כסף ← הדבק את המספר ← ₪${money(amount)}.\nאחרי התשלום לחץ 'שילמתי'.`);
  c.classList.add("pay-steps");
  app.querySelector(".bar").after(c); // top of the screen
  c.scrollIntoView({ behavior: "smooth", block: "center" });
  if (/android/i.test(navigator.userAgent)) {
    const b = document.createElement("button"); b.className = "pill"; b.style.setProperty("--accent", "var(--gold)"); b.textContent = "פתח את ביט";
    b.onclick = () => { location.href = "intent://#Intent;package=com.bnhp.payments.paymentsapp;S.browser_fallback_url=" + encodeURIComponent("https://play.google.com/store/apps/details?id=com.bnhp.payments.paymentsapp") + ";end"; };
    c.after(b);
  }
}

async function waitFor(serviceId) {
  await act(async () => {
    const r = await fnCall({ action: "wait", service_id: serviceId });
    if (r && r.locked) toast(`${r.locked.who || "מישהו"} ממתין עכשיו (עד ${hhmm(r.locked.until)}). נודיע לך כשיתפנה 🔔`);
    route(true);
  });
}

function showSettings() {
  clear();
  bar("הגדרות", { back: true });
  section("פרופיל");
  const name = field("השם שלך (מוצג למנהל ולאחרים)");
  pill("שמור שם", "gold", () => act(async () => { if (!name.value.trim()) return toast("כתוב שם"); await saveProfile({ display_name: name.value.trim() }); toast("נשמר ✓"); }));

  section("מראה ונגישות");
  choice("ערכת צבע", [["system", "לפי המכשיר"], ["dark", "כהה"], ["light", "בהיר"]], store.get("theme") || "system", v => { store.set("theme", v); applyLook(); showSettings(); });
  choice("גודל גופן", [["0.9", "קטן"], ["1", "רגיל"], ["1.15", "גדול"], ["1.3", "ענק"]], String(store.get("fs") || 1), v => { store.set("fs", Number(v)); applyLook(); showSettings(); });

  section("התראות");
  label(pushOn() ? "✅ התראות פועלות" : "❌ התראות כבויות");
  if (pushOn()) pill("כבה התראות", "line", () => act(disablePush));
  else pill("הפעל התראות", "cyan", () => act(enablePush));
  label("לכיבוי מלא: הגדרות האייפון ← התראות ← Pay or Wait.");

  section("חשבון");
  pill("התנתקות", "line", signOut);
  footer();
}
function choice(title, options, selected, onPick) {
  label(title);
  const row = h(`<div class="choices">${options.map(([v, t]) => `<button data-v="${esc(v)}" class="${v === selected ? "sel" : ""}">${esc(t)}</button>`).join("")}</div>`);
  row.querySelectorAll("button").forEach(b => b.onclick = () => { if (b.dataset.v !== selected) onPick(b.dataset.v); });
}

async function signOut() {
  // this phone should stop getting this account's codes
  try { await saveProfile({ web_push: null }); } catch {}
  store.del("session"); store.del("push_on"); store.del("group"); store.del("mode");
  route();
}

// ---------- the owner's 5-minute joke block ----------
let prankTimer = null;
function showPrank(untilIso) {
  const until = new Date(untilIso).getTime(), box = document.getElementById("prank"), timer = box.querySelector(".timer");
  if (prankTimer) return;
  box.style.display = "block";
  const faces = ["😂", "🤣", "😆", "😜", "🤪", "😝", "😹", "💩", "💩", "🍑"];
  // sounds (made here, not copied from anywhere): a sad "wah wah" on opening, a fart per popped emoji.
  // iPhone only plays sound after a tap, so if the opening one was blocked it plays on the first pop.
  const snd = n => new Audio(`sounds/${n}.mp3`).play();
  let loserPlayed = false;
  snd("loser").then(() => loserPlayed = true, () => {});
  const spawn = () => {
    if (box.querySelectorAll(".face").length >= 12) return;
    const f = document.createElement("div");
    f.className = "face"; f.textContent = faces[Math.floor(Math.random() * faces.length)];
    const W = innerWidth - 56, H = innerHeight - 56;
    f.style.left = (Math.random() < .5 ? Math.random() * W / 4 : W * 3 / 4 + Math.random() * W / 4) + "px";
    f.style.top = Math.random() * H + "px";
    box.appendChild(f);
    const wander = () => {
      if (!f.isConnected || f.classList.contains("boom")) return;
      f.style.left = Math.random() * W + "px"; f.style.top = Math.random() * H + "px";
      f.style.transform = `rotate(${Math.round(Math.random() * 80 - 40)}deg)`;
      setTimeout(wander, 2400);
    };
    setTimeout(wander, 50);
    f.onclick = () => {
      f.textContent = "💥"; f.classList.add("boom"); setTimeout(() => f.remove(), 400);
      if (!loserPlayed) { loserPlayed = true; snd("loser").catch(() => {}); }
      else snd("fart" + (1 + Math.floor(Math.random() * 3))).catch(() => {});
      const r = f.getBoundingClientRect();
      for (let i = 0; i < 7; i++) {
        const b = document.createElement("div"); b.className = "bit"; b.textContent = ["💨", "✨", "💫"][i % 3];
        b.style.left = r.left + 18 + "px"; b.style.top = r.top + 18 + "px"; box.appendChild(b);
        const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 70;
        requestAnimationFrame(() => { b.style.transform = `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d}px)`; b.style.opacity = 0; });
        setTimeout(() => b.remove(), 650);
      }
    };
  };
  const tick = () => {
    const left = Math.floor((until - Date.now()) / 1000);
    if (left <= 0) {
      // the server decides when it ends; ask again in a few seconds (phone clocks can run ahead)
      clearInterval(prankTimer); timer.textContent = "0:00";
      setTimeout(() => { prankTimer = null; box.style.display = "none"; box.querySelectorAll(".face,.bit").forEach(x => x.remove()); route(); }, 3000);
      return;
    }
    timer.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
    spawn();
  };
  prankTimer = setInterval(tick, 1000);
  tick();
}

// ---------- start ----------
// portrait only (the manifest says so for the installed app; this covers browsers that allow locking)
try { if (standalone()) screen.orientation.lock("portrait").catch(() => {}); } catch {}
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
  navigator.serviceWorker.addEventListener("message", e => { if (e.data === "refresh" && onMemberScreen) route(true); });
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && onMemberScreen) route(true); });
route();
</script>
